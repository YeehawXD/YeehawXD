<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Norbert, Unfinished</title>
<meta name="description" content="A very short adventure about not being ready. Everything you can see is drawn out of maths at runtime.">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0812;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 40%, #241a2c 0%, #0d0812 70%);
  }
  #game {
    display: block;
    image-rendering: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,220,180,0.05);
    border-radius: 2px;
    max-width: 100vw; max-height: 100vh;
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #d9a678; font: 600 15px "Trebuchet MS", Verdana, sans-serif;
    letter-spacing: 0.08em; pointer-events: none;
    transition: opacity .6s ease; z-index: 5;
  }
  #boot.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="game" width="1920" height="1080"></canvas>
<div id="boot">warming the clay…</div>

<script src="src/util.js"></script>
<script src="src/clay.js"></script>
<script src="src/themes.js"></script>
<script src="src/audio.js"></script>
<script src="src/fx.js"></script>
<script src="src/input.js"></script>
<script src="src/norbert.js"></script>
<script src="src/cast.js"></script>
<script src="src/dialogue.js"></script>
<script src="src/world.js"></script>
<script src="src/levels.js"></script>
<script src="src/ui.js"></script>
<script src="src/shots.js"></script>
<script src="src/game.js"></script>
<script>
  addEventListener('load', () => {
    const b = document.getElementById('boot');
    if (!b) return;
    setTimeout(() => { b.classList.add('gone'); setTimeout(() => b.remove(), 700); }, 400);
  });
</script>
</body>
</html>
