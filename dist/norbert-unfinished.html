<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Norbert">
<meta name="theme-color" content="#150f20">
<title>Norbert, Unfinished</title>
<meta name="description" content="A very short adventure about not being ready. Everything you can see is drawn out of maths at runtime.">
<style>
  :root {
    --pad-key: 62px;          /* d-pad key size, re-set for landscape below */
    --pad-big: 88px;          /* the jump button */
    --clay-hi: #e9b489;
    --clay-mid: #ce8459;
    --clay-lo: #7e3a26;
  }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #100b18;
    overflow: hidden;
    position: fixed;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
    font: 600 15px "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
  }

  #shell {
    position: fixed;
    inset: 0;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 38%, #241a2c 0%, #100b18 72%);
  }

  #stagewrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #game {
    display: block;
    box-shadow: 0 18px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,220,180,.06);
    border-radius: 2px;
  }

  /* ---- boot veil ---- */
  #boot {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    color: #d9a678; letter-spacing: .1em; font-size: 14px;
    background: #100b18;
    transition: opacity .5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  /* ================= on-screen controls ================= */
  /* Hidden entirely on machines with a real keyboard; the game never shows
     controls it does not need. */
  #pad, #pausebtn { display: none; }
  body.touch #pad { display: flex; }
  body.touch #pausebtn { display: block; }

  #pad {
    flex: 0 0 auto;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px 14px;
    box-sizing: border-box;
  }

  .cluster { display: grid; gap: 8px; }

  .cluster.dpad {
    grid-template-columns: repeat(3, var(--pad-key));
    grid-template-rows: repeat(2, var(--pad-key));
  }
  .k-up    { grid-area: 1 / 2; }
  .k-left  { grid-area: 2 / 1; }
  .k-down  { grid-area: 2 / 2; }
  .k-right { grid-area: 2 / 3; }

  .cluster.acts {
    grid-template-columns: var(--pad-key) var(--pad-big);
    grid-template-rows: var(--pad-key) var(--pad-big);
    align-items: end; justify-items: end;
  }
  .k-slurp { grid-area: 1 / 1 / 2 / 3; justify-self: end; width: calc(var(--pad-key) * 1.5); height: calc(var(--pad-key) * .78); }
  .k-lob   { grid-area: 2 / 1; }
  .k-jump  { grid-area: 2 / 2; width: var(--pad-big); height: var(--pad-big); font-size: 15px; }

  .btn {
    -webkit-appearance: none; appearance: none;
    width: var(--pad-key); height: var(--pad-key);
    border: 0; padding: 0; margin: 0;
    display: grid; place-items: center;
    font: 800 13px/1 "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
    letter-spacing: .04em;
    color: #40210f;
    text-shadow: 0 1px 0 rgba(255,232,200,.45);
    /* an irregular radius, because nothing here is a perfect circle */
    border-radius: 47% 53% 51% 49% / 50% 48% 52% 50%;
    background:
      radial-gradient(115% 115% at 32% 26%, var(--clay-hi) 0%, var(--clay-mid) 42%, #b06038 74%, var(--clay-lo) 100%);
    box-shadow:
      inset 0 -4px 7px rgba(74,26,12,.42),
      inset 0 3px 6px rgba(255,226,190,.42),
      0 5px 12px rgba(8,3,14,.45);
    transition: transform .06s ease, filter .06s ease;
    touch-action: none;
  }
  .btn:nth-of-type(2n) { border-radius: 52% 48% 47% 53% / 49% 52% 48% 51%; }
  .btn:nth-of-type(3n) { border-radius: 49% 51% 53% 47% / 52% 50% 50% 48%; }
  .btn.on {
    transform: translateY(3px) scale(.955);
    filter: brightness(1.14) saturate(1.05);
    box-shadow:
      inset 0 -2px 5px rgba(74,26,12,.5),
      inset 0 2px 8px rgba(120,44,20,.5),
      0 2px 5px rgba(8,3,14,.5);
  }
  .btn .arrow { font-size: 20px; line-height: 1; }

  #pausebtn {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 12;
    width: 44px; height: 30px;
    border: 0; padding: 0;
    border-radius: 8px 9px 8px 9px;
    background: rgba(28,16,34,.55);
    color: rgba(255,232,200,.75);
    font: 800 13px/1 "Trebuchet MS", system-ui, sans-serif;
    letter-spacing: .12em;
    touch-action: none;
  }
  #pausebtn.on { background: rgba(58,32,60,.75); }

  /* while a conversation is on screen the pad only gets in the way */
  body.reading #pad { opacity: 0; pointer-events: none; }
  #pad { transition: opacity .22s ease; }

  /* ---- portrait: picture up top, control deck along the bottom ---- */
  #hint { display: none; }
  @media (orientation: portrait) {
    /* sized off the viewport so both clusters always fit side by side */
    :root { --pad-key: min(66px, 14.6vw); --pad-big: min(90px, 20vw); }
    #stagewrap { align-items: flex-start; padding-top: 42px; }
    #pad {
      flex: 0 0 auto;
      align-items: flex-end;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }
    body.reading #pad { opacity: .14; }
    body.touch #hint {
      display: block;
      position: absolute; left: 0; right: 0; bottom: 18px;
      text-align: center;
      font: 600 12px/1.5 "Trebuchet MS", system-ui, sans-serif;
      letter-spacing: .1em;
      color: rgba(233,180,137,.42);
      pointer-events: none;
    }
    body.reading #hint { opacity: 0; }
  }

  /* ---- landscape: controls float over the corners, out of the way ---- */
  @media (orientation: landscape) {
    :root { --pad-key: 54px; --pad-big: 74px; }
    #pad {
      position: absolute;
      inset: auto 0 0 0;
      height: auto;
      pointer-events: none;
      padding: 0 max(14px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
      z-index: 10;
    }
    .cluster { pointer-events: auto; }
    .btn { opacity: .88; }
  }

  /* very short landscape (small phones): shrink so nothing overlaps the HUD */
  @media (orientation: landscape) and (max-height: 380px) {
    :root { --pad-key: 46px; --pad-big: 62px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="stagewrap">
    <canvas id="game" width="1920" height="1080"></canvas>
    <button id="pausebtn" data-act="pause" aria-label="Pause">❚❚</button>
    <div id="hint">turn your phone sideways for the full picture</div>
    <div id="boot">warming the clay…</div>
  </div>

  <div id="pad" aria-hidden="true">
    <div class="cluster dpad">
      <button class="btn k-up"    data-act="up"    aria-label="Stretch tall"><span class="arrow">▲</span></button>
      <button class="btn k-left"  data-act="left"  aria-label="Left"><span class="arrow">◀</span></button>
      <button class="btn k-down"  data-act="down"  aria-label="Squash flat"><span class="arrow">▼</span></button>
      <button class="btn k-right" data-act="right" aria-label="Right"><span class="arrow">▶</span></button>
    </div>
    <div class="cluster acts">
      <button class="btn k-slurp" data-act="slurp" aria-label="Slurp your pieces back">SLURP</button>
      <button class="btn k-lob"   data-act="lob"   aria-label="Tear a piece off">TEAR</button>
      <button class="btn k-jump"  data-act="jump"  aria-label="Jump">JUMP</button>
    </div>
  </div>
</div>

<script>
function setupShot() { return false; }

/* ===== src/util.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  util.js
   Small maths / colour / noise helpers. Loaded first; everything uses these.
   ========================================================================= */

const TAU = Math.PI * 2;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function invlerp(a, b, v) { return (v - a) / (b - a || 1); }
function smoothstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function smootherstep(t) { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); }
function approach(cur, tgt, step) {
  if (cur < tgt) return Math.min(cur + step, tgt);
  if (cur > tgt) return Math.max(cur - step, tgt);
  return tgt;
}
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }

/* ---- deterministic randomness -------------------------------------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* stable hash of a float -> [0,1) */
function hash1(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
/* signed hash, [-1,1] */
function shash1(n) { return hash1(n) * 2 - 1; }

/* smooth 1D value noise */
function noise1(x, seed) {
  seed = seed || 0;
  const i = Math.floor(x), f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(hash2(i, seed), hash2(i + 1, seed), u);
}
function fbm1(x, seed, oct) {
  oct = oct || 3;
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { v += a * noise1(x * f, seed + i * 17); f *= 2; a *= 0.5; }
  return v;
}
function noise2(x, y, seed) {
  seed = seed || 0;
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix + seed * 31.4, iy);
  const b = hash2(ix + 1 + seed * 31.4, iy);
  const c = hash2(ix + seed * 31.4, iy + 1);
  const d = hash2(ix + 1 + seed * 31.4, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}

/* ---- easing ---------------------------------------------------------- */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeOutElastic(t) {
  const c4 = TAU / 3;
  return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}
function easeOutBounce(t) {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
  return n1 * (t -= 2.625 / d1) * t + 0.984375;
}

/* ---- colour ---------------------------------------------------------- */

const _hexCache = new Map();
function hex2rgb(hex) {
  let c = _hexCache.get(hex);
  if (c) return c;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  c = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  _hexCache.set(hex, c);
  return c;
}
function rgb2hex(r, g, b) {
  const t = (v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  return '#' + t(r) + t(g) + t(b);
}
/* amt > 0 lightens toward white, amt < 0 darkens toward black */
function shade(hex, amt) {
  const c = hex2rgb(hex);
  if (amt >= 0) return rgb2hex(lerp(c.r, 255, amt), lerp(c.g, 255, amt), lerp(c.b, 255, amt));
  return rgb2hex(c.r * (1 + amt), c.g * (1 + amt), c.b * (1 + amt));
}
/* The key light and the ambient bounce, set per room. Highlights lean towards
   the key colour and shadows lean towards the ambient, so one palette change
   re-lights every object in the game at once: violet dusk on the windowsill,
   cold steel in the sink, red heat in the kiln room. */
let CLAY_KEY = { r: 255, g: 244, b: 205 };
let CLAY_AMB = { r: 40, g: 30, b: 62 };
function setClayLight(keyHex, ambHex) {
  CLAY_KEY = hex2rgb(keyHex || '#fff4cd');
  CLAY_AMB = hex2rgb(ambHex || '#281e3e');
}
/* lighten towards the key light -- clay highlights go yellow, never white */
function warmLight(hex, amt) {
  const c = hex2rgb(hex);
  return rgb2hex(lerp(c.r, CLAY_KEY.r, amt), lerp(c.g, CLAY_KEY.g, amt * 0.94), lerp(c.b, CLAY_KEY.b, amt * 0.86));
}
/* darken towards the ambient -- clay shadows are never black */
function coolShade(hex, amt) {
  const c = hex2rgb(hex);
  return rgb2hex(lerp(c.r, CLAY_AMB.r, amt), lerp(c.g, CLAY_AMB.g, amt), lerp(c.b, CLAY_AMB.b, amt));
}
function mixHex(a, b, t) {
  const x = hex2rgb(a), y = hex2rgb(b);
  return rgb2hex(lerp(x.r, y.r, t), lerp(x.g, y.g, t), lerp(x.b, y.b, t));
}
function rgba(hex, a) {
  const c = hex2rgb(hex);
  return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
}

/* ---- geometry -------------------------------------------------------- */

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* Chaikin corner-cutting: turns a chunky polygon into a soft handmade one */
function chaikin(pts, iterations, closed) {
  let p = pts;
  for (let it = 0; it < iterations; it++) {
    const out = [];
    const n = p.length;
    const last = closed ? n : n - 1;
    if (!closed) out.push(p[0]);
    for (let i = 0; i < last; i++) {
      const a = p[i], b = p[(i + 1) % n];
      out.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 });
      out.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 });
    }
    if (!closed) out.push(p[n - 1]);
    p = out;
  }
  return p;
}

/* remove points closer together than `min` (keeps curve budget sane) */
function decimate(pts, min, closed) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i], q = out[out.length - 1];
    if (dist2(p.x, p.y, q.x, q.y) >= min * min) out.push(p);
  }
  if (closed && out.length > 2) {
    const a = out[0], b = out[out.length - 1];
    if (dist2(a.x, a.y, b.x, b.y) < min * min) out.pop();
  }
  return out;
}

/* draw a closed smooth path through points (quadratic midpoint method) */
function smoothPath(ctx, pts, closed) {
  const n = pts.length;
  if (n < 3) return;
  if (closed) {
    const m0 = { x: (pts[n - 1].x + pts[0].x) / 2, y: (pts[n - 1].y + pts[0].y) / 2 };
    ctx.moveTo(m0.x, m0.y);
    for (let i = 0; i < n; i++) {
      const cur = pts[i], nxt = pts[(i + 1) % n];
      ctx.quadraticCurveTo(cur.x, cur.y, (cur.x + nxt.x) / 2, (cur.y + nxt.y) / 2);
    }
    ctx.closePath();
  } else {
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n - 1; i++) {
      const cur = pts[i], nxt = pts[i + 1];
      ctx.quadraticCurveTo(cur.x, cur.y, (cur.x + nxt.x) / 2, (cur.y + nxt.y) / 2);
    }
    ctx.lineTo(pts[n - 1].x, pts[n - 1].y);
  }
}

/* ---- misc ------------------------------------------------------------ */

function pick(arr, r) { return arr[Math.floor((r === undefined ? Math.random() : r) * arr.length) % arr.length]; }

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    if (w === '\n') { lines.push(line); line = ''; continue; }
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}


/* ===== src/clay.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  clay.js
   The claymation renderer.

   Everything visible in this game is drawn here. There are no sprites and no
   image files: every character, prop and hillside is a lumpy polygon that gets
   run through the same little material shader below -- warm key light from the
   upper left, violet ambient shadow, an inner rim, a soft specular, pressed
   thumbprints and a film grain on top.

   Two details do most of the work:
     * silhouettes are never perfect. Each blob's radius is a sum of sine
       harmonics seeded per object, so nothing is ever a true circle.
     * BOIL. Real stop-motion wobbles because the animator re-touched the model
       between frames. Clay.frame ticks at 12fps and nudges every silhouette,
       so the whole picture simmers the way claymation does.
   ========================================================================= */

const Clay = {
  frame: 0,          // 12fps stop-motion tick
  time: 0,           // seconds
  quality: 1,        // 1 = full, 0 = reduced (skip prints/grain)
  _grainPat: null,
  _paperPat: null,
};

/* ---------------------------------------------------------------------- */
/*  Silhouettes                                                            */
/* ---------------------------------------------------------------------- */

/* Periodic lumpy radius. Smooth by construction, so no seams. */
function _lumpR(theta, seed, wob, boil) {
  const p1 = hash1(seed * 1.7) * TAU, p2 = hash1(seed * 3.3 + 5) * TAU, p3 = hash1(seed * 7.1 + 9) * TAU;
  let b1 = 0, b2 = 0;
  if (boil) {
    b1 = shash1(Clay.frame * 0.37 + seed) * boil;
    b2 = shash1(Clay.frame * 0.91 + seed * 2.1 + 40) * boil;
  }
  return 1 + wob * (
    0.50 * Math.sin(2 * theta + p1 + b1) +
    0.30 * Math.sin(3 * theta + p2 + b2) +
    0.17 * Math.sin(5 * theta + p3) +
    0.09 * Math.sin(7 * theta + p1 * 2)
  );
}

/* Build (and path) a lumpy ellipse. */
Clay.blobPath = function (ctx, x, y, rx, ry, seed, wob, rot, boil, n) {
  n = n || 22;
  wob = wob === undefined ? 0.11 : wob;
  rot = rot || 0;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * TAU;
    const r = _lumpR(t, seed, wob, boil);
    const lx = Math.cos(t) * rx * r, ly = Math.sin(t) * ry * r;
    const px = x + lx * cos - ly * sin, py = y + lx * sin + ly * cos;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
};

/* ---------------------------------------------------------------------- */
/*  The clay material                                                      */
/* ---------------------------------------------------------------------- */

/* Applies clay shading to whatever path is currently on ctx.
   bb = {x,y,w,h} bounding box, used to aim the gradients.               */
Clay.material = function (ctx, bb, color, o) {
  o = o || {};
  const lightAmt = o.light === undefined ? 1 : o.light;
  const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
  const R = Math.max(bb.w, bb.h) / 2;

  ctx.save();
  if (o.p2d) ctx.clip(o.p2d); else ctx.clip();

  /* 1. base -- warm light upper-left, violet ambient lower-right.
        Wide surfaces (terrain) light from straight above instead, otherwise
        the gradient stretches into a ramp across the whole hillside. */
  const g = o.vert
    ? ctx.createLinearGradient(bb.x, bb.y, bb.x + 14, bb.y + Math.min(bb.h, o.vertH || 150))
    : ctx.createLinearGradient(bb.x + bb.w * 0.12, bb.y, bb.x + bb.w * 0.92, bb.y + bb.h);
  g.addColorStop(0, warmLight(color, 0.34 * lightAmt));
  g.addColorStop(0.40, warmLight(color, 0.06 * lightAmt));
  g.addColorStop(0.72, coolShade(color, 0.18));
  g.addColorStop(1, coolShade(color, 0.42));
  ctx.fillStyle = g;
  ctx.fillRect(bb.x - 2, bb.y - 2, bb.w + 4, bb.h + 4);

  /* 2. bottom-heavy occlusion so the form feels rounded and grounded */
  if (o.ao !== false) {
    const og = ctx.createRadialGradient(cx, bb.y + bb.h * 1.02, R * 0.15, cx, bb.y + bb.h * 0.98, R * 1.35);
    og.addColorStop(0, 'rgba(38,22,46,0.34)');
    og.addColorStop(1, 'rgba(38,22,46,0)');
    ctx.fillStyle = og;
    ctx.fillRect(bb.x - 2, bb.y - 2, bb.w + 4, bb.h + 4);
  }

  /* 3. inner rim light along the top-left edge (stroke, clipped inward) */
  if (o.rim !== false) {
    const rg = ctx.createLinearGradient(bb.x, bb.y, bb.x + bb.w * 0.85, bb.y + bb.h * 0.9);
    rg.addColorStop(0, rgba(warmLight(color, 0.72), 0.85 * lightAmt));
    rg.addColorStop(0.35, rgba(warmLight(color, 0.5), 0.28 * lightAmt));
    rg.addColorStop(0.6, 'rgba(0,0,0,0)');
    ctx.strokeStyle = rg;
    ctx.lineWidth = Math.max(1.4, R * 0.20);
    if (o.p2d) ctx.stroke(o.p2d); else ctx.stroke();
  }

  /* 4. inner shadow along the bottom-right edge */
  const sg = ctx.createLinearGradient(bb.x + bb.w * 0.15, bb.y + bb.h * 0.1, bb.x + bb.w, bb.y + bb.h);
  sg.addColorStop(0, 'rgba(0,0,0,0)');
  sg.addColorStop(0.5, 'rgba(0,0,0,0)');
  sg.addColorStop(1, rgba(coolShade(color, 0.66), 0.75));
  ctx.strokeStyle = sg;
  ctx.lineWidth = Math.max(1.6, R * 0.30);
  if (o.p2d) ctx.stroke(o.p2d); else ctx.stroke();

  /* 5. specular -- clay is matte, so this is broad and weak, plus one hot dot */
  if (o.spec !== false) {
    const sx = bb.x + bb.w * (o.specX === undefined ? 0.30 : o.specX);
    const sy = bb.y + bb.h * (o.specY === undefined ? 0.24 : o.specY);
    const pg = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 0.78);
    pg.addColorStop(0, 'rgba(255,248,228,' + (0.30 * lightAmt) + ')');
    pg.addColorStop(0.55, 'rgba(255,246,224,' + (0.07 * lightAmt) + ')');
    pg.addColorStop(1, 'rgba(255,246,224,0)');
    ctx.fillStyle = pg;
    ctx.fillRect(bb.x - 2, bb.y - 2, bb.w + 4, bb.h + 4);

    if (R > 7 && o.hotspot !== false) {
      const hg = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 0.20);
      hg.addColorStop(0, 'rgba(255,253,244,' + (0.5 * lightAmt) + ')');
      hg.addColorStop(1, 'rgba(255,253,244,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(sx - R * 0.3, sy - R * 0.3, R * 0.6, R * 0.6);
    }
  }

  /* 6. thumbprints & tool marks -- the tell that a hand made this */
  if (Clay.quality && o.prints !== 0) {
    if (o.markSize) Clay.surfaceMarks(ctx, bb, color, o.seed || 1, o.prints || 20, o.markSize);
    else Clay.thumbprints(ctx, bb, color, o.seed || 1, o.prints || 3, o.printScale || 1);
  }

  ctx.restore();

  /* 7. contact edge: barely-there dark line so shapes read against each other */
  if (o.edge !== false) {
    ctx.strokeStyle = rgba(coolShade(color, 0.62), o.edgeAlpha === undefined ? 0.30 : o.edgeAlpha);
    ctx.lineWidth = o.edgeWidth || 1.1;
    if (o.p2d) ctx.stroke(o.p2d); else ctx.stroke();
  }
};

/* Pressed ridges: a light stroke offset up-left with a dark stroke behind it.
   Reads as a groove pushed into the surface with a thumb. */
Clay.thumbprints = function (ctx, bb, color, seed, count, scale) {
  const R = Math.max(bb.w, bb.h) / 2;
  if (R < 5) return;
  const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
  const dark = rgba(coolShade(color, 0.5), 0.30);
  const lite = rgba(warmLight(color, 0.55), 0.42);
  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const h = seed * 13.7 + i * 4.31;
    const a = hash1(h) * TAU;
    const rad = (0.15 + hash1(h + 1) * 0.5) * R;
    const px = cx + Math.cos(a) * R * 0.42 * hash1(h + 2);
    const py = cy + Math.sin(a) * R * 0.42 * hash1(h + 3);
    const st = hash1(h + 4) * TAU;
    const sw = 0.7 + hash1(h + 5) * 1.5;
    const lw = clamp(R * 0.09 * scale, 0.8, 3.4);
    ctx.lineWidth = lw;
    ctx.strokeStyle = dark;
    ctx.beginPath(); ctx.arc(px + lw * 0.45, py + lw * 0.45, rad, st, st + sw); ctx.stroke();
    ctx.strokeStyle = lite;
    ctx.beginPath(); ctx.arc(px - lw * 0.3, py - lw * 0.3, rad, st, st + sw); ctx.stroke();
  }
  /* one whorl, sometimes -- an actual fingerprint left in the surface */
  if (R > 13 && hash1(seed * 5.5) > 0.55) {
    const wx = cx + shash1(seed * 2.2) * R * 0.35;
    const wy = cy + shash1(seed * 6.6) * R * 0.35;
    ctx.lineWidth = clamp(R * 0.045, 0.5, 1.3);
    for (let k = 1; k <= 3; k++) {
      const rr = R * 0.09 * k;
      ctx.strokeStyle = k % 2 ? dark : lite;
      ctx.beginPath();
      ctx.arc(wx, wy, rr, 0.4 + k * 0.5, 0.4 + k * 0.5 + 3.6);
      ctx.stroke();
    }
  }
};

/* Big surfaces get many small marks of a fixed size rather than a few marks
   scaled to the shape -- a hillside was pressed with the same thumb a hundred
   times, not with one enormous thumb. Marks are scattered on a jittered grid
   so they cover evenly without clumping. */
Clay.surfaceMarks = function (ctx, bb, color, seed, count, size) {
  const dark = rgba(coolShade(color, 0.5), 0.24);
  const lite = rgba(warmLight(color, 0.5), 0.30);
  const cell = Math.sqrt((bb.w * bb.h) / Math.max(1, count));
  const cols = Math.max(1, Math.ceil(bb.w / cell)), rows = Math.max(1, Math.ceil(bb.h / cell));
  ctx.lineCap = 'round';
  const lw = size * 0.34;
  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < cols; gx++) {
      const h = seed * 19.3 + gx * 3.71 + gy * 8.13;
      if (hash1(h + 9) > 0.86) continue;                       // leave gaps
      const px = bb.x + (gx + 0.15 + hash1(h) * 0.7) * cell;
      const py = bb.y + (gy + 0.15 + hash1(h + 1) * 0.7) * cell;
      const rad = size * (0.55 + hash1(h + 2) * 0.75);
      const st = hash1(h + 3) * TAU;
      const sw = 0.8 + hash1(h + 4) * 1.7;
      ctx.lineWidth = lw;
      ctx.strokeStyle = dark;
      ctx.beginPath(); ctx.arc(px + lw * 0.5, py + lw * 0.55, rad, st, st + sw); ctx.stroke();
      ctx.strokeStyle = lite;
      ctx.beginPath(); ctx.arc(px - lw * 0.35, py - lw * 0.4, rad, st, st + sw); ctx.stroke();
    }
  }
};

/* ---------------------------------------------------------------------- */
/*  Primitives                                                             */
/* ---------------------------------------------------------------------- */

/* A lumpy ball of clay. The workhorse. */
Clay.blob = function (ctx, o) {
  const rx = o.rx, ry = o.ry === undefined ? o.rx : o.ry;
  const wob = o.wob === undefined ? 0.10 : o.wob;
  const m = 1 + wob;
  Clay.blobPath(ctx, o.x, o.y, rx, ry, o.seed || 1, wob, o.rot || 0, o.boil || 0, o.n);
  Clay.material(ctx, { x: o.x - rx * m, y: o.y - ry * m, w: rx * 2 * m, h: ry * 2 * m }, o.color, o);
};

/* A rolled clay sausage between two points, tapered. Arms, legs, branches. */
Clay.limb = function (ctx, x1, y1, x2, y2, r1, r2, color, o) {
  o = o || {};
  r2 = r2 === undefined ? r1 : r2;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 0.0001;
  const nx = -dy / len, ny = dx / len;
  const seed = o.seed || 2;
  const steps = Math.max(5, Math.min(16, Math.round(len / 5)));
  const bow = o.bow || 0;                    /* sideways sag, so nothing is straight */
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const r = lerp(r1, r2, t) * (1 + 0.10 * Math.sin(t * 6 + seed) * (o.lumpy === false ? 0 : 1));
    const b = Math.sin(t * Math.PI) * bow;
    const px = lerp(x1, x2, t) + nx * b, py = lerp(y1, y2, t) + ny * b;
    pts.push({ x: px + nx * r, y: py + ny * r });
  }
  for (let i = steps; i >= 0; i--) {
    const t = i / steps;
    const r = lerp(r1, r2, t) * (1 + 0.10 * Math.sin(t * 6 + seed) * (o.lumpy === false ? 0 : 1));
    const b = Math.sin(t * Math.PI) * bow;
    const px = lerp(x1, x2, t) + nx * b, py = lerp(y1, y2, t) + ny * b;
    pts.push({ x: px - nx * r, y: py - ny * r });
  }
  ctx.beginPath();
  smoothPath(ctx, pts, true);
  const pad = Math.max(r1, r2) + Math.abs(bow);
  Clay.material(ctx, {
    x: Math.min(x1, x2) - pad, y: Math.min(y1, y2) - pad,
    w: Math.abs(dx) + pad * 2, h: Math.abs(dy) + pad * 2
  }, color, { seed: seed, prints: o.prints === undefined ? 2 : o.prints, light: o.light, edgeAlpha: o.edgeAlpha });
};

/* A slab of clay from an arbitrary polygon: terrain, furniture, props. */
Clay.slab = function (ctx, pts, color, o) {
  o = o || {};
  if (pts.length < 3) return;
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of pts) {
    if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y; if (p.y > maxy) maxy = p.y;
  }
  const bb = { x: minx, y: miny, w: maxx - minx, h: maxy - miny };
  ctx.beginPath();
  smoothPath(ctx, pts, true);
  Clay.material(ctx, bb, color, o);
};

function _polyPath(ctx, pts, dx, dy) {
  ctx.beginPath();
  if (dx || dy) {
    const m = pts.map(p => ({ x: p.x + dx, y: p.y + dy }));
    smoothPath(ctx, m, true);
  } else smoothPath(ctx, pts, true);
}
function _bbox(pts) {
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of pts) {
    if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y; if (p.y > maxy) maxy = p.y;
  }
  return { x: minx, y: miny, w: maxx - minx, h: maxy - miny };
}

/* A landmass. Takes a baked shape from Clay.makeShape.

   Same material as everything else, plus the things that make a big surface
   read as sculpted: layers of clay pressed on in strata, a rolled lighter band
   along the walkable top, and grit pushed into the face. */
Clay.terrain = function (ctx, shape, o) {
  o = o || {};
  const color = o.color;
  const bb = shape.bb;
  const seed = o.seed || 1;
  const path = shape.path;

  Clay.material(ctx, bb, color, {
    p2d: path, seed: seed,
    prints: o.marks === undefined ? Math.min(420, Math.round(bb.w * bb.h / 950)) : o.marks,
    markSize: o.markSize || 5.5, edgeAlpha: 0.36, edgeWidth: 1.4, spec: false,
    vert: true, vertH: o.vertH || 130, ao: false,
  });

  ctx.save();
  ctx.clip(path);

  /* strata -- clay pressed on in layers, each slightly off-colour */
  if (o.strata !== false) {
    const bands = o.bands || 4;
    const H = Math.min(bb.h, 190);
    for (let i = 0; i < bands; i++) {
      const t = i / bands;
      const yy = bb.y + 14 + t * H * 0.95;
      const tone = i % 2 ? coolShade(color, 0.13) : warmLight(color, 0.06);
      ctx.beginPath();
      ctx.moveTo(bb.x - 4, yy);
      const segs = Math.max(3, Math.min(90, Math.round(bb.w / 34)));
      for (let sgi = 1; sgi <= segs; sgi++) {
        const px = bb.x + (bb.w + 8) * (sgi / segs) - 4;
        const py = yy + (fbm1(px * 0.013 + i * 9 + seed, seed + i, 2) - 0.5) * 11;
        ctx.lineTo(px, py);
      }
      ctx.lineTo(bb.x + bb.w + 4, bb.y + bb.h + 6);
      ctx.lineTo(bb.x - 4, bb.y + bb.h + 6);
      ctx.closePath();
      ctx.fillStyle = rgba(tone, 0.40);
      ctx.fill();
    }
  }

  /* grit and pebbles pressed into the face */
  const gritN = Math.min(140, Math.round(bb.w * bb.h / 2400));
  for (let i = 0; i < gritN; i++) {
    const h = seed * 7.3 + i * 5.17;
    const px = bb.x + hash1(h) * bb.w, py = bb.y + hash1(h + 1) * Math.min(bb.h, 260);
    const r = 1 + hash1(h + 2) * 2.6;
    ctx.beginPath(); ctx.ellipse(px + 0.7, py + 0.8, r, r * 0.82, 0, 0, TAU);
    ctx.fillStyle = 'rgba(30,16,36,0.22)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(px, py, r, r * 0.82, 0, 0, TAU);
    ctx.fillStyle = rgba(hash1(h + 3) > 0.5 ? warmLight(color, 0.3) : coolShade(color, 0.28), 0.5);
    ctx.fill();
  }

  /* the rolled top band -- island MINUS island-shifted-down */
  if (o.top) {
    ctx.save();
    const cut = new Path2D();
    cut.rect(bb.x - 30, bb.y - 60, bb.w + 60, bb.h + 120);
    cut.addPath(shape.down);
    ctx.clip(cut, 'evenodd');
    Clay.material(ctx, { x: bb.x, y: bb.y, w: bb.w, h: shape.topH * 2.6 }, o.top, {
      p2d: path, seed: seed + 3,
      prints: Math.min(260, Math.round(bb.w / 11)), markSize: 3.2,
      edge: false, rim: false, spec: false, vert: true, vertH: shape.topH * 2.4,
    });
    /* a bright lip right at the crest, where the light catches the roll */
    ctx.strokeStyle = rgba(warmLight(o.top, 0.58), 0.5);
    ctx.lineWidth = 2.6;
    ctx.stroke(path);
    ctx.restore();

    /* thin dark line under the band so the top reads as its own slab */
    ctx.strokeStyle = 'rgba(34,18,40,0.28)';
    ctx.lineWidth = 1.6;
    ctx.stroke(shape.down);
  }
  ctx.restore();
};

/* Soft contact shadow on the floor beneath something. */
Clay.groundShadow = function (ctx, x, y, rx, ry, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
  g.addColorStop(0, 'rgba(30,16,38,' + alpha + ')');
  g.addColorStop(0.55, 'rgba(30,16,38,' + alpha * 0.5 + ')');
  g.addColorStop(1, 'rgba(30,16,38,0)');
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry / rx);
  ctx.translate(-x, -y);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, rx, 0, TAU); ctx.fill();
  ctx.restore();
};

/* ---------------------------------------------------------------------- */
/*  Eyes -- the whole personality budget goes here                         */
/* ---------------------------------------------------------------------- */

/* Big flat shirt-button with thread holes. Norbert's left eye. */
Clay.buttonEye = function (ctx, x, y, r, rot, o) {
  o = o || {};
  const seed = o.seed || 9;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  /* socket */
  ctx.beginPath(); ctx.ellipse(0, r * 0.16, r * 1.12, r * 1.06, 0, 0, TAU);
  ctx.fillStyle = 'rgba(48,24,34,0.32)'; ctx.fill();
  /* button body */
  Clay.blobPath(ctx, 0, 0, r, r * 0.96, seed, 0.045, 0, 0, 18);
  Clay.material(ctx, { x: -r * 1.1, y: -r * 1.1, w: r * 2.2, h: r * 2.2 },
    o.color || '#f4ecd8', { seed: seed, prints: 0, specY: 0.2, edgeAlpha: 0.35 });
  /* inset ring */
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.68, r * 0.66, 0, 0, TAU);
  ctx.strokeStyle = 'rgba(90,58,44,0.35)'; ctx.lineWidth = r * 0.11; ctx.stroke();
  /* four thread holes + criss-cross thread */
  const hr = Math.max(0.9, r * 0.13);
  ctx.fillStyle = 'rgba(58,32,26,0.85)';
  const hp = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
  for (const h of hp) {
    ctx.beginPath(); ctx.arc(h[0] * r * 0.3, h[1] * r * 0.3, hr, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = o.thread || 'rgba(70,44,36,0.7)';
  ctx.lineWidth = Math.max(0.8, r * 0.1); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-r * 0.3, -r * 0.3); ctx.lineTo(r * 0.3, r * 0.3);
  ctx.moveTo(r * 0.3, -r * 0.3); ctx.lineTo(-r * 0.3, r * 0.3);
  ctx.stroke();
  /* glass glint */
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.26, r * 0.16, -0.6, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  ctx.restore();
};

/* Tiny shiny bead pressed into the clay. Norbert's right eye. */
Clay.beadEye = function (ctx, x, y, r, o) {
  o = o || {};
  /* pressed socket */
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.2, r * 1.5, r * 1.35, 0, 0, TAU);
  ctx.fillStyle = 'rgba(48,24,34,0.28)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x - r * 0.15, y - r * 0.2, r * 1.35, r * 1.2, 0, 0, TAU);
  ctx.fillStyle = 'rgba(255,236,206,0.18)'; ctx.fill();
  /* bead */
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, 0, x, y, r * 1.25);
  g.addColorStop(0, o.hi || '#6c7a8c');
  g.addColorStop(0.45, o.color || '#20242e');
  g.addColorStop(1, '#0c0d12');
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 0.34, y - r * 0.38, r * 0.3, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.28, y + r * 0.3, r * 0.16, 0, TAU);
  ctx.fillStyle = 'rgba(255,220,180,0.35)'; ctx.fill();
};

/* Craft-shop googly eye: plastic dome, loose pupil that keeps rattling. */
Clay.googlyEye = function (ctx, x, y, r, px, py, o) {
  o = o || {};
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.18, r * 1.14, r * 1.08, 0, 0, TAU);
  ctx.fillStyle = 'rgba(40,20,30,0.3)'; ctx.fill();
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r * 1.1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.75, '#f0eee7'); g.addColorStop(1, '#c9c3b4');
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
  const pr = r * (o.pupil || 0.46);
  const lim = r - pr - r * 0.06;
  const cx2 = x + clamp(px, -1, 1) * lim, cy2 = y + clamp(py, -1, 1) * lim;
  ctx.beginPath(); ctx.arc(cx2, cy2, pr, 0, TAU);
  ctx.fillStyle = '#14161c'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx2 - pr * 0.3, cy2 - pr * 0.32, pr * 0.32, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  /* plastic dome sheen */
  ctx.beginPath(); ctx.ellipse(x - r * 0.32, y - r * 0.4, r * 0.42, r * 0.24, -0.7, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  ctx.strokeStyle = 'rgba(60,40,44,0.35)'; ctx.lineWidth = Math.max(0.7, r * 0.08); ctx.stroke();
};

/* A dent pressed into clay -- Norbert has one of these in his forehead. */
Clay.dent = function (ctx, x, y, rx, ry, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  const g = ctx.createLinearGradient(0, -ry, 0, ry);
  g.addColorStop(0, rgba(coolShade(color, 0.45), 0.55));
  g.addColorStop(0.62, rgba(coolShade(color, 0.12), 0.16));
  g.addColorStop(1, rgba(warmLight(color, 0.55), 0.45));
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
};

/* ---------------------------------------------------------------------- */
/*  Textures                                                               */
/* ---------------------------------------------------------------------- */

Clay.grainPattern = function (ctx) {
  if (Clay._grainPat) return Clay._grainPat;
  const S = 128;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  const d = img.data;
  /* Mean-zero RGBA: half the grains lighten, half darken, most pixels are
     clear. That lets the grain go down with plain source-over instead of an
     'overlay' blend, which on a phone is the difference between a full-screen
     destination read every frame and a cheap composite. */
  for (let i = 0; i < S * S; i++) {
    const v = Math.random();
    const up = v > 0.5;
    const a = Math.pow(Math.random(), 2.2) * 190;
    d[i * 4] = up ? 255 : 0;
    d[i * 4 + 1] = up ? 250 : 4;
    d[i * 4 + 2] = up ? 235 : 12;
    d[i * 4 + 3] = a;
  }
  g.putImageData(img, 0, 0);
  Clay._grainPat = ctx.createPattern(c, 'repeat');
  return Clay._grainPat;
};

/* Coarser, softer speckle for backdrops -- reads as felt / sugar paper. */
Clay.paperPattern = function (ctx) {
  if (Clay._paperPat) return Clay._paperPat;
  const S = 160;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const r = Math.random() * 1.9 + 0.35;
    const v = Math.random() > 0.5 ? 255 : 0;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (Math.random() * 0.26) + ')';
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  /* a few paper fibres */
  g.lineWidth = 0.7;
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * S, y = Math.random() * S, a = Math.random() * TAU, l = 4 + Math.random() * 16;
    g.strokeStyle = 'rgba(255,255,255,' + (Math.random() * 0.16) + ')';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  Clay._paperPat = ctx.createPattern(c, 'repeat');
  return Clay._paperPat;
};

/* Film grain over the whole frame.

   Filling the screen with a repeating pattern every frame means sampling that
   pattern per pixel, which on a phone costs more than the entire cast put
   together. So the grain is baked once into a full-resolution sheet a little
   larger than the screen, and each stop-motion tick blits it from a different
   offset -- same crawl, one cheap composite. */
Clay._grainSheet = null;
Clay.grain = function (ctx, w, h, alpha, devScale) {
  if (!Clay.quality) return;
  const S = Math.max(1, devScale || 1);
  const bw = Math.ceil(w * S), bh = Math.ceil(h * S);
  const PAD = 96;
  let sheet = Clay._grainSheet;
  if (!sheet || sheet.w !== bw || sheet.h !== bh) {
    const cv = document.createElement('canvas');
    cv.width = bw + PAD; cv.height = bh + PAD;
    const g = cv.getContext('2d');
    const img = g.createImageData(cv.width, cv.height);
    const d = img.data;
    /* mean-zero speckle: half lightens, half darkens, most of it is clear */
    for (let i = 0; i < cv.width * cv.height; i++) {
      const up = Math.random() > 0.5;
      d[i * 4] = up ? 255 : 0;
      d[i * 4 + 1] = up ? 250 : 4;
      d[i * 4 + 2] = up ? 235 : 12;
      d[i * 4 + 3] = Math.pow(Math.random(), 2.2) * 200;
    }
    g.putImageData(img, 0, 0);
    sheet = Clay._grainSheet = { cv, w: bw, h: bh };
  }
  const ox = (hash1(Clay.frame * 3.1) * PAD) | 0;
  const oy = (hash1(Clay.frame * 7.7 + 3) * PAD) | 0;
  ctx.save();
  ctx.globalAlpha = alpha * 2.6;
  ctx.drawImage(sheet.cv, ox, oy, bw, bh, 0, 0, w, h);
  ctx.restore();
};

Clay.paper = function (ctx, x, y, w, h, alpha, scale) {
  const pat = Clay.paperPattern(ctx);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = alpha;
  if (scale && scale !== 1) { ctx.scale(scale, scale); x /= scale; y /= scale; w /= scale; h /= scale; }
  ctx.fillStyle = pat;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
};

/* Vignette + warm bloom in the corners of the lens. */
Clay.vignette = function (ctx, w, h, amount, tint) {
  const g = ctx.createRadialGradient(w * 0.5, h * 0.46, h * 0.28, w * 0.5, h * 0.5, h * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(0,0,0,' + amount * 0.28 + ')');
  g.addColorStop(1, tint ? rgba(tint, amount) : 'rgba(8,4,14,' + amount + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
};

/* The lens, baked.

   The vignette and the colour grade never change within a room, so paying for
   two more full-screen passes every frame is pure waste -- on a phone they
   cost more than the entire cast. Bake them into one translucent layer per
   room and blit it. */
Clay._lens = null;
Clay.lens = function (ctx, w, h, key, amount, tint, gradeCol, gradeA) {
  const id = key + '|' + Math.round(w) + 'x' + Math.round(h);
  let L = Clay._lens;
  if (!L || L.id !== id) {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w));
    cv.height = Math.max(1, Math.round(h));
    const g = cv.getContext('2d');
    if (gradeCol && gradeA) {
      /* the grade was an 'overlay' wash; at these strengths a straight tint
         at a little under two thirds reads the same and costs nothing */
      g.fillStyle = rgba(gradeCol, gradeA * 0.62);
      g.fillRect(0, 0, cv.width, cv.height);
    }
    Clay.vignette(g, cv.width, cv.height, amount, tint);
    L = Clay._lens = { id, cv };
  }
  ctx.drawImage(L.cv, 0, 0, L.cv.width, L.cv.height, 0, 0, w, h);
};

/* ---------------------------------------------------------------------- */
/*  Terrain outlines                                                       */
/* ---------------------------------------------------------------------- */

/* Walk the boundary of a boolean tile grid and return closed loops of points
   in world space, so terrain can be drawn as sculpted slabs instead of tiles. */
Clay.traceGrid = function (solidAt, w, h, ts) {
  const edges = new Map();          // "x,y" -> [ [toX,toY], ... ]
  const key = (x, y) => x + ',' + y;
  const add = (ax, ay, bx, by) => {
    const k = key(ax, ay);
    let a = edges.get(k);
    if (!a) { a = []; edges.set(k, a); }
    a.push([bx, by]);
  };
  /* wind every edge so the solid side is always on the right of travel */
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (!solidAt(x, y)) continue;
      const x0 = x * ts, y0 = y * ts, x1 = x0 + ts, y1 = y0 + ts;
      if (!solidAt(x, y - 1)) add(x0, y0, x1, y0);      // top    ->
      if (!solidAt(x + 1, y)) add(x1, y0, x1, y1);      // right  v
      if (!solidAt(x, y + 1)) add(x1, y1, x0, y1);      // bottom <-
      if (!solidAt(x - 1, y)) add(x0, y1, x0, y0);      // left   ^
    }
  }

  const loops = [];
  let guard = 0;
  while (edges.size && guard++ < 40000) {
    const startKey = edges.keys().next().value;
    const parts = startKey.split(',');
    let cx = +parts[0], cy = +parts[1];
    const sx = cx, sy = cy;
    let dx = 0, dy = 0;
    const loop = [];
    let steps = 0;
    while (steps++ < 200000) {
      const k = key(cx, cy);
      const arr = edges.get(k);
      if (!arr || !arr.length) break;

      /* At a pinch point several boundary edges leave the same corner.
         Always take the sharpest right turn: that keeps the walk on the
         boundary it arrived on instead of hopping to a different one and
         splitting the island into two broken half-loops. */
      let idx = 0;
      if (arr.length > 1 && (dx || dy)) {
        let bestScore = -1;
        for (let i = 0; i < arr.length; i++) {
          const ex = Math.sign(arr[i][0] - cx), ey = Math.sign(arr[i][1] - cy);
          const rx = -dy, ry = dx;                 // right of travel
          const straight = ex * dx + ey * dy;
          const right = ex * rx + ey * ry;
          const sc = right > 0 ? 3 : (straight > 0 ? 2 : (right < 0 ? 1 : 0));
          if (sc > bestScore) { bestScore = sc; idx = i; }
        }
      }
      const nxt = arr.splice(idx, 1)[0];
      if (!arr.length) edges.delete(k);

      loop.push({ x: cx, y: cy });
      dx = Math.sign(nxt[0] - cx); dy = Math.sign(nxt[1] - cy);
      cx = nxt[0]; cy = nxt[1];
      if (cx === sx && cy === sy) break;
    }
    if (loop.length > 3) loops.push(loop);
  }
  return loops;
};

/* Take a boxy tile outline and make it look pinched by hand.

   The trick is to resample the loop at a fixed spacing FIRST. Corner-cutting a
   raw tile outline turns a hundred-tile-long floor into one enormous smooth
   curve, because after collinear points are dropped there is nothing left
   between the two ends. Resampling keeps the straights straight and lets the
   smoothing kernel only round what is actually a corner. */
Clay.handify = function (loop, amp, freq, seed, smooth) {
  const STEP = 11;
  const pts = [];
  const n0 = loop.length;
  for (let i = 0; i < n0; i++) {
    const a = loop[i], b = loop[(i + 1) % n0];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const k = Math.max(1, Math.round(d / STEP));
    for (let j = 0; j < k; j++) pts.push({ x: lerp(a.x, b.x, j / k), y: lerp(a.y, b.y, j / k) });
  }
  if (pts.length < 8) return loop;

  /* round the corners with a few [1 2 1] passes -- radius stays local */
  let s = pts;
  const passes = smooth === undefined ? 3 : smooth;
  for (let p = 0; p < passes; p++) {
    const m = s.length;
    const out = new Array(m);
    for (let i = 0; i < m; i++) {
      const a = s[(i - 1 + m) % m], c = s[i], b = s[(i + 1) % m];
      out[i] = { x: (a.x + c.x * 2 + b.x) * 0.25, y: (a.y + c.y * 2 + b.y) * 0.25 };
    }
    s = out;
  }

  /* then push every vertex out along its own normal, by noise along the edge */
  const n = s.length;
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    const p = s[i], a = s[(i - 1 + n) % n], b = s[(i + 1) % n];
    const tx = b.x - a.x, ty = b.y - a.y;
    const l = Math.hypot(tx, ty) || 1;
    const nx = ty / l, ny = -tx / l;
    const u = i * STEP * freq * 3;
    const d = (fbm1(u + seed * 10, seed, 3) - 0.5) * 2 * amp
      + (noise1(u * 0.31 + seed * 3, seed + 5) - 0.5) * amp * 0.9;
    out[i] = { x: p.x + nx * d, y: p.y + ny * d };
  }
  return out;
};

/* Bake a traced outline into reusable Path2D objects. Terrain paths are
   stroked, filled and clipped six or seven times a frame; building them once
   at level load instead of per draw call is most of the terrain budget. */
Clay.makeShape = function (pts, topH) {
  const bb = _bbox(pts);
  const path = new Path2D();
  _pathInto(path, pts, 0, 0);
  const down = new Path2D();
  _pathInto(down, pts, 0, topH || 9);
  return { pts, bb, path, down, topH: topH || 9 };
};

function _pathInto(path, pts, dx, dy) {
  const n = pts.length;
  if (n < 3) return;
  const m0x = (pts[n - 1].x + pts[0].x) / 2 + dx, m0y = (pts[n - 1].y + pts[0].y) / 2 + dy;
  path.moveTo(m0x, m0y);
  for (let i = 0; i < n; i++) {
    const cur = pts[i], nxt = pts[(i + 1) % n];
    path.quadraticCurveTo(cur.x + dx, cur.y + dy, (cur.x + nxt.x) / 2 + dx, (cur.y + nxt.y) / 2 + dy);
  }
  path.closePath();
}


/* ===== src/themes.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  themes.js
   Six rooms of one craft club, seen from four inches off the ground.

   Each theme owns its sky, its parallax backdrop, the colour of its dirt and
   the colour of its light. Backdrops are drawn live rather than baked: they're
   only a few dozen shapes each, and drawing them live means the lamp can
   flicker and the paint can flow.
   ========================================================================= */

const THEMES = {};

/* helper: repeating scatter that's stable in world space */
function scatterX(camX, factor, spacing, W, cb) {
  const ox = camX * factor;
  const i0 = Math.floor((ox - spacing) / spacing);
  const i1 = Math.ceil((ox + W + spacing) / spacing);
  for (let i = i0; i <= i1; i++) cb(i, i * spacing - ox);
}

function skyGrad(ctx, H, stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  return g;
}

/* ======================================================================= */
/*  1. THE WINDOWSILL -- 5:04pm, raining, everything just woke up          */
/* ======================================================================= */

THEMES.sill = {
  name: 'The Windowsill',
  key: '#ffe8bc', shadow: '#2a1e46',
  ground: '#cfc4b0', groundTop: '#e6dcc6', groundH: 7,
  light: '#ffd9a8', ambient: '#3a3358',
  vignette: 0.42, vignetteTint: '#1b1430',
  grade: ['#ff9d5c', 0.07],
  music: 'sill',
  back(ctx, cam, W, H, t) {
    ctx.fillStyle = skyGrad(ctx, H, [
      [0, '#2c2a52'], [0.28, '#4d3a63'], [0.52, '#8f5568'],
      [0.72, '#d2825f'], [0.88, '#efb374'], [1, '#f6d29a'],
    ]);
    ctx.fillRect(0, 0, W, H);

    /* long flat painted clouds */
    for (let i = 0; i < 7; i++) {
      const px = ((i * 233 + t * (4 + i)) % (W + 420)) - 210 - cam.x * 0.02;
      const py = 40 + hash1(i * 3.1) * 130;
      const w = 70 + hash1(i * 5.7) * 130, h = 7 + hash1(i * 2.3) * 9;
      const c = i % 2 ? '#f2b98d' : '#c98a83';
      ctx.globalAlpha = 0.5 + hash1(i) * 0.3;
      Clay.blob(ctx, { x: px, y: py, rx: w, ry: h, seed: 300 + i, color: c, wob: 0.30, prints: 0, edge: false, spec: false, n: 26 });
      ctx.globalAlpha = 1;
    }

    /* the town, four inches away and a whole world off */
    const skyline = (factor, base, col, scale, seed, lit) => {
      const ox = cam.x * factor;
      const span = 900;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(-20, H + 10);
      /* walk building by building so the roofline is made of flats and steps */
      let wx = Math.floor((ox - 120) / 26) * 26;
      const endX = ox + W + 120;
      const wins = [];
      while (wx < endX) {
        const k = Math.floor(wx / 26) + seed * 37;
        const bw = 18 + Math.floor(hash1(k * 1.7) * 3) * 13;
        let bh = (14 + hash1(k * 3.1) * 30) * scale;
        const kind = hash1(k * 5.3);
        const x0 = wx - ox, x1 = x0 + bw;
        ctx.lineTo(x0, base - bh);
        if (kind > 0.90) {
          /* a spire */
          ctx.lineTo(x0 + bw * 0.34, base - bh);
          ctx.lineTo(x0 + bw * 0.5, base - bh - 30 * scale);
          ctx.lineTo(x0 + bw * 0.66, base - bh);
        } else if (kind > 0.78) {
          /* pitched roof */
          ctx.lineTo(x0 + bw * 0.5, base - bh - 9 * scale);
        }
        ctx.lineTo(x1, base - bh);
        /* chimney */
        if (hash1(k * 9.1) > 0.66) {
          const cx0 = x0 + bw * 0.72;
          ctx.lineTo(cx0, base - bh);
          ctx.lineTo(cx0, base - bh - 8 * scale);
          ctx.lineTo(cx0 + 4 * scale, base - bh - 8 * scale);
          ctx.lineTo(cx0 + 4 * scale, base - bh);
        }
        wins.push([x0, bw, bh]);
        wx += bw;
      }
      ctx.lineTo(W + 20, H + 10);
      ctx.closePath();
      ctx.fill();

      /* windows: somebody is still up */
      for (const [x0, bw, bh] of wins) {
        const cols = Math.max(1, Math.floor(bw / 9));
        const rows2 = Math.max(1, Math.floor(bh / 11));
        for (let r = 0; r < rows2; r++) {
          for (let c = 0; c < cols; c++) {
            const h2 = hash1((x0 + ox) * 0.31 + r * 7.7 + c * 3.3 + seed);
            if (h2 < 0.62) continue;
            const px = x0 + 3 + c * 9, py = base - bh + 6 + r * 11;
            if (px < -6 || px > W + 6 || py > base - 3) continue;
            const fl = h2 > 0.965 ? (Math.sin(t * 4 + px) > -0.3 ? 1 : 0.15) : 1;
            ctx.fillStyle = 'rgba(255,206,130,' + (lit * fl) + ')';
            ctx.fillRect(px, py, 2.6 * scale, 3.4 * scale);
          }
        }
      }
    };
    skyline(0.030, H * 0.815, '#4d3557', 1.0, 2, 0.55);
    skyline(0.068, H * 0.885, '#362543', 1.3, 8, 0.75);

    /* rain, out there where it can't reach you */
    ctx.strokeStyle = 'rgba(210,200,230,0.16)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    for (let i = 0; i < 110; i++) {
      const x = (hash1(i * 3.7) * (W + 120) + t * 26 * (0.6 + hash1(i) * 0.7)) % (W + 120) - 60;
      const y = (hash1(i * 7.1) * H + t * 260 * (0.7 + hash1(i * 2) * 0.6)) % H;
      ctx.moveTo(x, y); ctx.lineTo(x - 2.5, y + 12);
    }
    ctx.stroke();

    /* the window: glass, then muntins */
    const gx = -cam.x * 0.11;
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#bcd8e8';
    ctx.fillRect(0, 0, W, H * 0.93);
    ctx.restore();

    /* condensation and rain running down the inside */
    for (let i = 0; i < 46; i++) {
      const x = (i * 137.5 + 20) % 900 + gx * 0.5;
      if (x < -10 || x > W + 10) continue;
      const sp = 8 + hash1(i * 5.3) * 26;
      const y = ((hash1(i * 1.7) * 400 + t * sp) % (H * 0.95));
      const r = 0.8 + hash1(i * 8.2) * 2.1;
      ctx.fillStyle = 'rgba(226,240,248,0.30)';
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 1.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.5, r * 0.3, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(226,240,248,0.10)';
      ctx.lineWidth = r * 0.7;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 16); ctx.stroke();
    }

    /* muntins -- chipped white gloss over old wood */
    const bar = (x, y, w, h) => {
      const pts = [];
      const n = 16;
      for (let i = 0; i <= n; i++) pts.push({ x: x + (w * i) / n + shash1(i * 3 + x) * 0.8, y: y + shash1(i * 7 + x) * 0.9 });
      for (let i = n; i >= 0; i--) pts.push({ x: x + (w * i) / n + shash1(i * 5 + x) * 0.8, y: y + h + shash1(i * 11 + x) * 0.9 });
      Clay.slab(ctx, pts, '#e8e2d2', { seed: x * 0.3 + y, prints: Math.round(w * h / 260) + 2, markSize: 3.4, vert: true, vertH: h * 2 });
    };
    scatterX(cam.x, 0.11, 300, W, (i, x) => { bar(x - 7, -20, 14, H); });
    bar(-20, H * 0.30, W + 40, 12);
    ctx.restore && null;
  },
  fore(ctx, cam, W, H, t) {
    /* a spider plant leaning in from the left, out of focus */
    const x0 = -cam.x * 0.5 - 30;
    if (x0 > -260) {
      ctx.save();
      ctx.filter = 'blur(2.4px)';
      ctx.globalAlpha = 0.9;
      for (let i = 0; i < 6; i++) {
        const a = -0.9 + i * 0.28;
        const L = 150 + i * 26;
        Clay.limb(ctx, x0, H + 30, x0 + Math.cos(a) * L, H + 30 + Math.sin(a) * L,
          9, 1.5, i % 2 ? '#4a6b3e' : '#3d5a35', { seed: 90 + i, bow: 26 - i * 8, prints: 0 });
      }
      ctx.restore();
    }
  },
};

/* ======================================================================= */
/*  2. THE GREAT TABLE -- one lamp, ten thousand square miles              */
/* ======================================================================= */

THEMES.table = {
  name: 'The Great Table',
  key: '#ffe2ab', shadow: '#241a32',
  ground: '#8a5f3c', groundTop: '#a8794c', groundH: 8,
  light: '#ffcf8a', ambient: '#2a2136',
  vignette: 0.55, vignetteTint: '#160f22',
  grade: ['#ffab52', 0.09],
  music: 'table',
  back(ctx, cam, W, H, t) {
    ctx.fillStyle = skyGrad(ctx, H, [
      [0, '#171226'], [0.42, '#26192c'], [0.78, '#402334'], [1, '#54303a'],
    ]);
    ctx.fillRect(0, 0, W, H);

    /* the lamp, off to the upper right, doing its best */
    const flick = 1 + Math.sin(t * 11) * 0.012 + Math.sin(t * 3.7) * 0.02;
    const lx = W * 0.80 - cam.x * 0.04, ly = -40;
    const cone = ctx.createRadialGradient(lx, ly, 10, lx, ly, H * 1.5);
    cone.addColorStop(0, 'rgba(255,206,138,' + 0.36 * flick + ')');
    cone.addColorStop(0.4, 'rgba(255,178,104,0.12)');
    cone.addColorStop(1, 'rgba(255,150,90,0)');
    ctx.fillStyle = cone; ctx.fillRect(0, 0, W, H);

    /* the rest of the room, a long way off and barely lit */
    const shelfY = H * 0.21;
    scatterX(cam.x, 0.05, 210, W, (i, x) => {
      /* soft silhouettes of jars and tins, rounded so they read as objects
         rather than as a bar chart */
      const blob = (bx, bw2, bh2, round) => {
        ctx.beginPath();
        ctx.moveTo(bx, shelfY);
        ctx.lineTo(bx, shelfY - bh2 + round);
        ctx.quadraticCurveTo(bx, shelfY - bh2, bx + round, shelfY - bh2);
        ctx.lineTo(bx + bw2 - round, shelfY - bh2);
        ctx.quadraticCurveTo(bx + bw2, shelfY - bh2, bx + bw2, shelfY - bh2 + round);
        ctx.lineTo(bx + bw2, shelfY);
        ctx.closePath();
        const g2 = ctx.createLinearGradient(bx, shelfY - bh2, bx + bw2, shelfY);
        g2.addColorStop(0, 'rgba(52,36,54,0.85)');
        g2.addColorStop(1, 'rgba(26,18,34,0.9)');
        ctx.fillStyle = g2; ctx.fill();
        ctx.strokeStyle = 'rgba(255,196,140,0.10)'; ctx.lineWidth = 1; ctx.stroke();
      };
      blob(x + 18, 28, 42 + hash1(i * 3.1) * 16, 9);
      blob(x + 66, 36, 60 + hash1(i * 5.7) * 20, 5);
      blob(x + 126, 22, 30 + hash1(i * 7.3) * 14, 10);
      const bg2 = ctx.createLinearGradient(0, shelfY, 0, shelfY + 10);
      bg2.addColorStop(0, 'rgba(66,44,50,0.9)');
      bg2.addColorStop(1, 'rgba(20,13,24,0.9)');
      ctx.fillStyle = bg2;
      ctx.fillRect(x - 12, shelfY, 214, 9);
      ctx.fillStyle = 'rgba(255,190,130,0.09)';
      ctx.fillRect(x - 12, shelfY, 214, 1.4);
    });

    /* GIANT craft supplies, mid distance. Everything here is a landmark. */
    const ox = cam.x * 0.16;
    const propsAt = (baseX) => {
      const x = baseX - ox;
      if (x < -300 || x > W + 300) return;
      const gy = H * 0.72;
      const k = Math.round(baseX / 520);
      const kind = k % 4;
      ctx.save();
      ctx.globalAlpha = 0.95;
      if (kind === 0) {
        /* jam jar bristling with brushes */
        for (let i = 0; i < 7; i++) {
          const a = -1.9 + i * 0.2 + shash1(i + k) * 0.08;
          const L = 120 + hash1(i * 3 + k) * 60;
          Clay.limb(ctx, x + 40, gy - 30, x + 40 + Math.cos(a) * L, gy - 30 + Math.sin(a) * L,
            4, 3, '#5a4632', { seed: k * 9 + i, bow: 2, prints: 0 });
          Clay.blob(ctx, {
            x: x + 40 + Math.cos(a) * L, y: gy - 30 + Math.sin(a) * L, rx: 5, ry: 9,
            seed: k + i, color: ['#b8563f', '#3f6b7a', '#7a6b3f'][i % 3], wob: 0.2, rot: a + 1.57, prints: 0,
          });
        }
        Clay.blob(ctx, { x: x + 40, y: gy - 8, rx: 40, ry: 46, seed: k * 3, color: '#4a5560', wob: 0.05, prints: 2, edgeAlpha: 0.2 });
        ctx.fillStyle = 'rgba(210,240,255,0.13)';
        ctx.beginPath(); ctx.ellipse(x + 24, gy - 20, 9, 30, 0.1, 0, TAU); ctx.fill();
      } else if (kind === 1) {
        /* the glue bottle, orange cap, permanently crusted */
        Clay.blob(ctx, { x: x, y: gy - 34, rx: 30, ry: 52, seed: k * 5, color: '#c8c3b4', wob: 0.05, prints: 3 });
        Clay.blob(ctx, { x: x, y: gy - 92, rx: 14, ry: 22, seed: k * 5 + 1, color: '#d9762e', wob: 0.09, prints: 1 });
        Clay.blob(ctx, { x: x - 4, y: gy - 112, rx: 6, ry: 10, seed: k * 5 + 2, color: '#e08a3c', wob: 0.2, prints: 0 });
      } else if (kind === 2) {
        /* scissors, leaning, closed, faintly threatening */
        ctx.save(); ctx.translate(x, gy); ctx.rotate(-0.22);
        Clay.limb(ctx, 0, 0, 6, -150, 9, 4, '#9aa4ad', { seed: k, bow: 3, prints: 1 });
        Clay.limb(ctx, 6, 0, 14, -146, 8, 4, '#7d868f', { seed: k + 1, bow: -2, prints: 1 });
        Clay.blob(ctx, { x: 2, y: 6, rx: 15, ry: 20, seed: k + 2, color: '#2f3f52', wob: 0.1, prints: 1 });
        Clay.blob(ctx, { x: 20, y: 10, rx: 13, ry: 17, seed: k + 3, color: '#2a394a', wob: 0.1, prints: 1 });
        ctx.restore();
      } else {
        /* stack of sugar paper */
        for (let i = 0; i < 9; i++) {
          const c = ['#c86b7a', '#6b8fc8', '#c8b26b', '#7ac887'][i % 4];
          Clay.blob(ctx, {
            x: x + shash1(i * 3 + k) * 5, y: gy - 6 - i * 7, rx: 78, ry: 5,
            seed: k * 11 + i, color: c, wob: 0.045, prints: 0, edgeAlpha: 0.25, n: 26,
          });
        }
      }
      ctx.restore();
    };
    scatterX(cam.x, 0.16, 520, W, (i, x) => propsAt(i * 520 + ox));

    /* dust in the lamplight */
    ctx.fillStyle = 'rgba(255,222,170,0.5)';
    for (let i = 0; i < 60; i++) {
      const sx = (hash1(i * 3.3) * 1400 - cam.x * 0.3) % (W + 60) - 30;
      const sy = (hash1(i * 7.7) * H + Math.sin(t * 0.35 + i) * 22 + t * 5) % H;
      const r = 0.5 + hash1(i * 2.2) * 1.1;
      ctx.globalAlpha = 0.18 + 0.3 * (0.5 + 0.5 * Math.sin(t * 1.6 + i));
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
};

/* ======================================================================= */
/*  3. THE PAINT SHELF -- where the colour lives                           */
/* ======================================================================= */

THEMES.paint = {
  name: 'The Paint Shelf',
  key: '#fff0d8', shadow: '#2b1640',
  ground: '#6b5340', groundTop: '#8a6b4c', groundH: 8,
  light: '#ffe6c0', ambient: '#2b2340',
  vignette: 0.44, vignetteTint: '#1a1030',
  grade: ['#ff7ad0', 0.055],
  music: 'paint',
  back(ctx, cam, W, H, t) {
    ctx.fillStyle = skyGrad(ctx, H, [
      [0, '#241a34'], [0.4, '#3a2242'], [0.75, '#54294a'], [1, '#6b3350'],
    ]);
    ctx.fillRect(0, 0, W, H);

    /* splattered back wall */
    const ox0 = cam.x * 0.06;
    for (let i = 0; i < 40; i++) {
      const bx = (i * 173.1) % 2400 - ox0;
      if (bx < -60 || bx > W + 60) continue;
      const by = hash1(i * 5.1) * H * 0.9;
      const r = 4 + hash1(i * 2.9) * 22;
      const c = ['#d94f9c', '#3fb2c9', '#e8c33f', '#5fc46b', '#9a5fd9'][i % 5];
      ctx.globalAlpha = 0.16 + hash1(i * 8) * 0.12;
      Clay.blob(ctx, { x: bx, y: by, rx: r, ry: r * (0.7 + hash1(i) * 0.5), seed: 400 + i, color: c, wob: 0.4, prints: 0, edge: false, spec: false });
      for (let d = 0; d < 3; d++) {
        const a = hash1(i * 3 + d) * TAU, dd = r * (1.4 + hash1(i + d) * 1.6);
        ctx.beginPath(); ctx.arc(bx + Math.cos(a) * dd, by + Math.sin(a) * dd, 1 + hash1(i * d + 2) * 3.4, 0, TAU);
        ctx.fillStyle = c; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    /* shelves stacked away into the dark, each with a row of little jars */
    for (let sh = 0; sh < 3; sh++) {
      const f = 0.09 + sh * 0.05;
      const sy = H * (0.30 + sh * 0.16);
      const dim = 1 - sh * 0.16;
      const spacing = 54 + sh * 9;
      const jScale = 0.62 + sh * 0.14;

      scatterX(cam.x, f, spacing, W, (i, x) => {
        const c = ['#d94f9c', '#3fb2c9', '#e8c33f', '#5fc46b', '#9a5fd9', '#e8623f', '#4a7ec0'][Math.abs(i * 3 + sh) % 7];
        const jh = (17 + hash1(i * 3.3 + sh) * 7) * jScale;
        const jw = (7 + hash1(i * 7.1 + sh) * 3) * jScale;
        const y = sy - jh;
        const g = ctx.createRadialGradient(x, y, 1, x, y, jh * 2.2);
        g.addColorStop(0, rgba(c, 0.20 * dim));
        g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g; ctx.fillRect(x - jh * 2.4, y - jh * 2.4, jh * 4.8, jh * 4.8);
        /* glass body with the paint sitting in the bottom two thirds */
        ctx.fillStyle = 'rgba(226,240,246,' + (0.16 * dim) + ')';
        ctx.beginPath(); ctx.rect(x - jw, y - jh * 0.5, jw * 2, jh * 1.5); ctx.fill();
        ctx.fillStyle = rgba(c, 0.86 * dim);
        ctx.fillRect(x - jw + 0.6, y + jh * 0.05, jw * 2 - 1.2, jh * 0.95);
        ctx.fillStyle = rgba(warmLight(c, 0.4), 0.5 * dim);
        ctx.fillRect(x - jw + 0.6, y + jh * 0.05, jw * 0.5, jh * 0.95);
        /* screw cap */
        ctx.fillStyle = rgba('#b9b2a2', dim);
        ctx.fillRect(x - jw * 1.15, y - jh * 0.75, jw * 2.3, jh * 0.32);
        ctx.fillStyle = 'rgba(255,244,220,' + (0.22 * dim) + ')';
        ctx.fillRect(x - jw * 1.15, y - jh * 0.75, jw * 2.3, 1.1);
        /* highlight down the glass */
        ctx.fillStyle = 'rgba(255,255,255,' + (0.22 * dim) + ')';
        ctx.fillRect(x - jw * 0.72, y - jh * 0.35, jw * 0.34, jh * 1.15);
      });

      /* the board itself, in front of the jars so they sit ON it */
      const bd = ctx.createLinearGradient(0, sy, 0, sy + 13 + sh * 2);
      bd.addColorStop(0, ['#6b4a4e', '#5a3d44', '#4a333c'][sh]);
      bd.addColorStop(1, ['#3a2530', '#31202b', '#281a24'][sh]);
      ctx.fillStyle = bd;
      ctx.fillRect(0, sy, W, 13 + sh * 2);
      ctx.fillStyle = 'rgba(255,214,170,' + (0.16 - sh * 0.04) + ')';
      ctx.fillRect(0, sy, W, 1.6);
      ctx.fillStyle = 'rgba(12,6,14,0.35)';
      ctx.fillRect(0, sy + 13 + sh * 2, W, 5);
    }
  },
};

/* ======================================================================= */
/*  4. THE SINK -- cold, loud, and full of opinions                        */
/* ======================================================================= */

THEMES.sink = {
  name: 'The Sink',
  key: '#e8f6ff', shadow: '#122636',
  ground: '#8d949a', groundTop: '#a9b1b6', groundH: 6,
  light: '#dff1ff', ambient: '#22303f',
  vignette: 0.5, vignetteTint: '#0c1824',
  grade: ['#6fd0ff', 0.08],
  music: 'sink',
  back(ctx, cam, W, H, t) {
    ctx.fillStyle = skyGrad(ctx, H, [
      [0, '#16222e'], [0.34, '#22364a'], [0.68, '#33506a'], [1, '#456c88'],
    ]);
    ctx.fillRect(0, 0, W, H);

    /* brushed steel basin wall: long soft vertical streaks */
    const ox = cam.x * 0.08;
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 90; i++) {
      const x = (i * 41.7) % 1600 - ox;
      if (x < -8 || x > W + 8) continue;
      const g = ctx.createLinearGradient(x, 0, x, H);
      const v = hash1(i * 3.1);
      g.addColorStop(0, 'rgba(190,214,232,' + (0.03 + v * 0.07) + ')');
      g.addColorStop(0.6, 'rgba(150,180,205,' + (0.02 + v * 0.05) + ')');
      g.addColorStop(1, 'rgba(90,120,150,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x, 0, 2 + v * 5, H);
    }
    ctx.restore();

    /* the tap, enormous, up there, dripping on a schedule */
    const tx = W * 0.24 - cam.x * 0.14;
    if (tx > -180 && tx < W + 180) {
      Clay.limb(ctx, tx - 70, -30, tx - 70, H * 0.20, 22, 20, '#9fb0bd', { seed: 3, bow: 0, prints: 2 });
      Clay.limb(ctx, tx - 70, H * 0.20, tx + 30, H * 0.22, 19, 15, '#94a6b4', { seed: 4, bow: -28, prints: 2 });
      Clay.blob(ctx, { x: tx + 34, y: H * 0.25, rx: 15, ry: 11, seed: 5, color: '#7f929f', wob: 0.08, prints: 1 });
      const dp = (t * 0.42) % 1;
      if (dp > 0.12) {
        const dy = H * 0.27 + easeInCubic((dp - 0.12) / 0.88) * H * 0.8;
        ctx.fillStyle = 'rgba(200,230,246,0.7)';
        ctx.beginPath(); ctx.ellipse(tx + 34, dy, 3.4, 5.4 + dp * 4, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(tx + 32.6, dy - 1.6, 1.1, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(220,244,255,0.28)';
      ctx.beginPath(); ctx.ellipse(tx - 78, H * 0.08, 5, 60, 0.03, 0, TAU); ctx.fill();
    }

    /* soap bubbles: iridescent, doomed */
    for (let i = 0; i < 26; i++) {
      const bx = ((hash1(i * 3.7) * 1800 - cam.x * 0.3) % (W + 120) + W + 120) % (W + 120) - 60;
      const by = (hash1(i * 8.1) * H + H - (t * (7 + hash1(i) * 16) % (H + 120))) ;
      const r = 4 + hash1(i * 5.5) * 16;
      const g = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.35, 0, bx, by, r);
      g.addColorStop(0, 'rgba(255,255,255,0.16)');
      g.addColorStop(0.65, 'rgba(170,220,255,0.06)');
      g.addColorStop(0.93, 'rgba(255,190,240,0.30)');
      g.addColorStop(1, 'rgba(190,255,230,0.14)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.ellipse(bx - r * 0.4, by - r * 0.45, r * 0.2, r * 0.12, -0.7, 0, TAU); ctx.fill();
    }
  },
};

/* ======================================================================= */
/*  5. THE KILN ROOM -- 1000 degrees of career advancement                 */
/* ======================================================================= */

THEMES.kiln = {
  name: 'The Kiln Room',
  key: '#ffd39a', shadow: '#3d100a',
  ground: '#633a33', groundTop: '#8a4d3a', groundH: 7,
  light: '#ffb066', ambient: '#3a1420',
  vignette: 0.58, vignetteTint: '#1a0508',
  grade: ['#ff5a1e', 0.13],
  music: 'kiln',
  back(ctx, cam, W, H, t) {
    ctx.fillStyle = skyGrad(ctx, H, [
      [0, '#150609'], [0.36, '#2d0c10'], [0.66, '#4f1512'], [0.88, '#79251a'], [1, '#9c3a1e'],
    ]);
    ctx.fillRect(0, 0, W, H);

    /* the kiln itself: a wall of firebrick with vents that breathe */
    const ox = cam.x * 0.07;
    const bw = 46, bh = 22;
    for (let r = 0; r < Math.ceil(H / bh) + 1; r++) {
      for (let c = -1; c < W / bw + 2; c++) {
        const x = c * bw - (ox % bw) + (r % 2 ? bw / 2 : 0);
        const y = r * bh - 10;
        const v = hash2(Math.floor((x + ox) / bw), r);
        ctx.fillStyle = mixHex('#3a1a16', '#5c2a1e', v);
        ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
        ctx.fillStyle = 'rgba(255,150,80,0.05)';
        ctx.fillRect(x + 1, y + 1, bw - 2, 2);
      }
    }

    /* vents, glowing, pulsing like something asleep */
    scatterX(cam.x, 0.07, 250, W, (i, x) => {
      const y = H * (0.30 + hash1(i * 3.1) * 0.4);
      const pulse = 0.65 + 0.35 * Math.sin(t * 1.6 + i * 1.3) + 0.08 * Math.sin(t * 9 + i);
      const g = ctx.createRadialGradient(x, y, 2, x, y, 96);
      g.addColorStop(0, 'rgba(255,222,150,' + 0.5 * pulse + ')');
      g.addColorStop(0.25, 'rgba(255,130,40,' + 0.28 * pulse + ')');
      g.addColorStop(1, 'rgba(255,70,10,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 100, y - 100, 200, 200);
      /* a cast-iron grille with the fire behind it */
      ctx.fillStyle = 'rgba(16,5,5,0.92)';
      ctx.fillRect(x - 27, y - 15, 54, 30);
      ctx.strokeStyle = 'rgba(96,44,28,0.9)'; ctx.lineWidth = 2.4;
      ctx.strokeRect(x - 27, y - 15, 54, 30);
      for (let k = 0; k < 5; k++) {
        const yy = y - 11 + k * 5.4;
        const gg = ctx.createLinearGradient(x - 24, yy, x + 24, yy);
        gg.addColorStop(0, 'rgba(255,' + (120 + k * 16) + ',44,' + (0.45 + 0.4 * pulse) + ')');
        gg.addColorStop(0.5, 'rgba(255,' + (196 + k * 10) + ',120,' + (0.72 + 0.28 * pulse) + ')');
        gg.addColorStop(1, 'rgba(255,' + (120 + k * 16) + ',44,' + (0.45 + 0.4 * pulse) + ')');
        ctx.fillStyle = gg;
        ctx.fillRect(x - 24, yy, 48, 3.2);
      }
      ctx.fillStyle = 'rgba(255,236,190,' + (0.14 * pulse) + ')';
      ctx.fillRect(x - 27, y - 15, 54, 2)
    });

    /* the shelf of the already-fired, watching you climb past */
    const shelfY = H * 0.54;
    scatterX(cam.x, 0.18, 74, W, (i, x) => {
      const h = 18 + hash1(i * 5.3) * 30;
      const w = 9 + hash1(i * 2.7) * 13;
      const belly = hash1(i * 8.1) > 0.5 ? 1.35 : 1.02;
      ctx.beginPath();
      ctx.moveTo(x - w, shelfY);
      ctx.bezierCurveTo(x - w * belly, shelfY - h * 0.55, x - w * 0.62, shelfY - h * 0.9, x - w * 0.5, shelfY - h);
      ctx.lineTo(x + w * 0.5, shelfY - h);
      ctx.bezierCurveTo(x + w * 0.62, shelfY - h * 0.9, x + w * belly, shelfY - h * 0.55, x + w, shelfY);
      ctx.closePath();
      const pg = ctx.createLinearGradient(x - w, shelfY - h, x + w, shelfY);
      pg.addColorStop(0, 'rgba(92,34,22,0.95)');
      pg.addColorStop(0.45, 'rgba(40,13,12,0.95)');
      pg.addColorStop(1, 'rgba(20,6,8,0.95)');
      ctx.fillStyle = pg; ctx.fill();
      /* rim light from the vents behind them */
      ctx.strokeStyle = 'rgba(255,138,62,0.5)'; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.fillStyle = 'rgba(255,166,90,0.22)';
      ctx.beginPath(); ctx.ellipse(x - w * 0.45, shelfY - h * 0.55, 1.9, h * 0.26, 0.06, 0, TAU); ctx.fill();
    });
    /* the board, with a lit edge instead of a hard black bar */
    const sg2 = ctx.createLinearGradient(0, shelfY - 1, 0, shelfY + 13);
    sg2.addColorStop(0, 'rgba(120,52,30,0.95)');
    sg2.addColorStop(0.22, 'rgba(46,15,12,0.95)');
    sg2.addColorStop(1, 'rgba(14,4,6,0.85)');
    ctx.fillStyle = sg2;
    ctx.fillRect(0, shelfY - 1, W, 14);
    ctx.fillStyle = 'rgba(255,160,84,0.30)';
    ctx.fillRect(0, shelfY - 1, W, 1.6);

    /* embers */
    for (let i = 0; i < 54; i++) {
      const life = (t * (0.16 + hash1(i) * 0.2) + hash1(i * 3)) % 1;
      const ex = (hash1(i * 7.3) * 1500 - cam.x * 0.4) % (W + 80) - 40
        + Math.sin(t * 1.4 + i * 2) * 14;
      const ey = H + 20 - life * (H + 60);
      const a = Math.sin(life * Math.PI) * 0.85;
      const r = 0.7 + hash1(i * 2.1) * 1.7;
      ctx.fillStyle = 'rgba(255,' + (120 + Math.floor(hash1(i) * 110)) + ',60,' + a + ')';
      ctx.beginPath(); ctx.arc(ex, ey, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,140,' + a * 0.5 + ')';
      ctx.beginPath(); ctx.arc(ex, ey, r * 0.4, 0, TAU); ctx.fill();
    }

    /* heat haze along the floor */
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#ff9a4a';
    for (let i = 0; i < 8; i++) {
      const y = H * 0.72 + i * 9;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= W; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.045 + t * 3 + i) * 3.4);
      ctx.lineTo(W, y + 7); ctx.lineTo(0, y + 7); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  },
};

/* ======================================================================= */
/*  6. DAWN -- Wednesday, 6:41am, and nobody exploded                      */
/* ======================================================================= */

THEMES.dawn = {
  name: 'Dawn',
  key: '#fff8e6', shadow: '#3e3048',
  ground: '#c3b39a', groundTop: '#ddd0b8', groundH: 7,
  light: '#fff2d8', ambient: '#5d5a72',
  vignette: 0.26, vignetteTint: '#4a3a48',
  grade: ['#ffd9a0', 0.10],
  music: 'dawn',
  back(ctx, cam, W, H, t) {
    ctx.fillStyle = skyGrad(ctx, H, [
      [0, '#6d6a92'], [0.3, '#a98aa0'], [0.6, '#e5b394'], [0.85, '#f7d6ac'], [1, '#fdeccb'],
    ]);
    ctx.fillRect(0, 0, W, H);

    /* the doorway, wide open, full of morning */
    const dx = W * 0.72 - cam.x * 0.10;
    const g = ctx.createRadialGradient(dx, H * 0.55, 10, dx, H * 0.55, 340);
    g.addColorStop(0, 'rgba(255,248,224,0.85)');
    g.addColorStop(0.35, 'rgba(255,232,190,0.42)');
    g.addColorStop(1, 'rgba(255,220,170,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    /* god rays leaning in */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 7; i++) {
      const a = -0.75 + i * 0.09;
      const w = 16 + hash1(i * 3.3) * 30;
      ctx.globalAlpha = 0.05 + hash1(i) * 0.05 + Math.sin(t * 0.5 + i) * 0.015;
      ctx.fillStyle = '#fff0cc';
      ctx.save();
      ctx.translate(dx, H * 0.14); ctx.rotate(a + 1.9);
      ctx.beginPath(); ctx.moveTo(-w * 0.2, 0); ctx.lineTo(w * 0.2, 0);
      ctx.lineTo(w * 1.5, 620); ctx.lineTo(-w * 1.5, 620); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    /* the room, softly, in the background */
    const ox = cam.x * 0.13;
    ctx.fillStyle = 'rgba(120,100,110,0.32)';
    scatterX(cam.x, 0.13, 300, W, (i, x) => {
      ctx.fillRect(x, H * 0.30, 150, 7);
      ctx.fillRect(x + 30, H * 0.30 - 34, 22, 34);
      ctx.fillRect(x + 78, H * 0.30 - 50, 30, 50);
    });

    /* dust, everywhere, lit like it matters */
    for (let i = 0; i < 90; i++) {
      const sx = (hash1(i * 3.3) * 1700 - cam.x * 0.34) % (W + 60) - 30;
      const sy = (hash1(i * 7.7) * H * 1.2 + Math.sin(t * 0.3 + i) * 26 - t * 3) % H;
      const r = 0.5 + hash1(i * 2.2) * 1.5;
      ctx.globalAlpha = 0.16 + 0.42 * (0.5 + 0.5 * Math.sin(t * 1.1 + i * 1.7));
      ctx.fillStyle = '#fff6de';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
};
