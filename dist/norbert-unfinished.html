/* =========================================================================
   NORBERT, UNFINISHED  --  audio.js
   Every sound in this game is synthesised at runtime. There are no audio
   files. The squelches are filtered noise with a falling pitch envelope, the
   score is a small generative music box, and each character "speaks" in blips
   tuned to their personality (Gary is a smug oboe, Beans is one flat bloop).
   ========================================================================= */

const Sound = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  ready: false, muted: false,
  _noise: null,
  _music: null,
  _next: 0, _step: 0, _timer: null,
  volMusic: 0.5, volSfx: 0.75,
};

Sound.init = function () {
  if (Sound.ready) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = Sound.ctx = new AC();
  Sound.master = ctx.createGain(); Sound.master.gain.value = 0.9;
  Sound.master.connect(ctx.destination);

  /* a touch of room, so the craft room sounds like a room */
  const conv = ctx.createConvolver();
  const len = Math.floor(ctx.sampleRate * 1.1);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * 0.55;
    }
  }
  conv.buffer = buf;
  const wet = ctx.createGain(); wet.gain.value = 0.20;
  conv.connect(wet); wet.connect(Sound.master);
  Sound.verb = conv;

  Sound.musicGain = ctx.createGain(); Sound.musicGain.gain.value = Sound.volMusic;
  Sound.musicGain.connect(Sound.master); Sound.musicGain.connect(conv);
  Sound.sfxGain = ctx.createGain(); Sound.sfxGain.gain.value = Sound.volSfx;
  Sound.sfxGain.connect(Sound.master);
  const sfxVerb = ctx.createGain(); sfxVerb.gain.value = 0.5;
  Sound.sfxGain.connect(sfxVerb); sfxVerb.connect(conv);

  /* one second of noise, reused forever */
  const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  Sound._noise = nb;

  Sound.ready = true;
  Sound._next = ctx.currentTime + 0.1;
  Sound._timer = setInterval(Sound._schedule, 26);
};

Sound.resume = function () {
  if (!Sound.ready) Sound.init();
  if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
};

/* Safari on iOS keeps a fresh AudioContext suspended until something is
   actually played from inside a user gesture, so play one silent sample. */
Sound.unlock = function () {
  Sound.resume();
  if (!Sound.ctx) return;
  try {
    const b = Sound.ctx.createBuffer(1, 1, 22050);
    const s = Sound.ctx.createBufferSource();
    s.buffer = b;
    s.connect(Sound.ctx.destination);
    s.start(0);
  } catch (e) { /* already running */ }
  if (Sound._pending) { const k = Sound._pending; Sound._pending = null; Sound.music(k); }
};

Sound.setMuted = function (m) {
  Sound.muted = m;
  if (Sound.master) Sound.master.gain.setTargetAtTime(m ? 0 : 0.9, Sound.ctx.currentTime, 0.05);
};

/* ---- little synth voices --------------------------------------------- */

function _env(g, t, a, d, peak) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}

function _tone(freq, t, dur, type, vol, dest, slideTo) {
  const c = Sound.ctx;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  _env(g, t, Math.min(0.012, dur * 0.2), dur, vol);
  o.connect(g); g.connect(dest || Sound.sfxGain);
  o.start(t); o.stop(t + dur + 0.06);
  return { o, g };
}

function _noiseBurst(t, dur, vol, f0, f1, q, dest) {
  const c = Sound.ctx;
  const s = c.createBufferSource();
  s.buffer = Sound._noise;
  s.loop = true;
  s.playbackRate.value = 0.8 + Math.random() * 0.5;
  const bp = c.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = q || 1.4;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  const g = c.createGain();
  _env(g, t, 0.006, dur, vol);
  s.connect(bp); bp.connect(g); g.connect(dest || Sound.sfxGain);
  s.start(t); s.stop(t + dur + 0.05);
}

/* ---- the sound effect list -------------------------------------------- */

const SFX = {
  /* the core noise of this entire game */
  squelch(t, p) {
    const v = (p && p.vol) || 0.5;
    const pitch = (p && p.pitch) || 1;
    _noiseBurst(t, 0.16, 0.3 * v, 900 * pitch, 180 * pitch, 1.1);
    _tone(300 * pitch, t, 0.13, 'sine', 0.22 * v, null, 90 * pitch);
    _tone(180 * pitch, t + 0.02, 0.10, 'triangle', 0.12 * v, null, 70 * pitch);
  },
  step(t, p) {
    const pitch = 0.8 + Math.random() * 0.5;
    _noiseBurst(t, 0.07, 0.13, 700 * pitch, 220 * pitch, 1.6);
    _tone(150 * pitch, t, 0.055, 'sine', 0.09, null, 80);
  },
  jump(t) {
    _tone(220, t, 0.2, 'sine', 0.20, null, 520);
    _noiseBurst(t, 0.1, 0.13, 500, 1400, 1.0);
  },
  land(t, p) {
    const v = (p && p.vol) || 1;
    _noiseBurst(t, 0.15, 0.24 * v, 620, 110, 1.0);
    _tone(120, t, 0.14, 'sine', 0.24 * v, null, 55);
  },
  tear(t) {
    _noiseBurst(t, 0.26, 0.30, 1600, 420, 2.2);
    _tone(420, t, 0.22, 'triangle', 0.14, null, 150);
  },
  lob(t) {
    _tone(360, t, 0.15, 'sine', 0.20, null, 760);
    _noiseBurst(t, 0.12, 0.10, 900, 2200, 1.2);
  },
  slurp(t) {
    _noiseBurst(t, 0.30, 0.24, 260, 1700, 3.4);
    _tone(140, t, 0.28, 'sine', 0.16, null, 620);
  },
  splat(t) {
    _noiseBurst(t, 0.22, 0.34, 1200, 130, 0.9);
    _tone(240, t, 0.18, 'sine', 0.22, null, 60);
  },
  plink(t, p) {
    const f = (p && p.freq) || 900;
    _tone(f, t, 0.5, 'sine', 0.18);
    _tone(f * 2.01, t, 0.3, 'sine', 0.07);
  },
  chime(t) {
    [0, 4, 7, 12].forEach((s, i) => _tone(523.25 * Math.pow(2, s / 12), t + i * 0.06, 1.3, 'sine', 0.14 - i * 0.02));
  },
  sad(t) {
    [0, -3, -5].forEach((s, i) => _tone(392 * Math.pow(2, s / 12), t + i * 0.14, 0.9, 'triangle', 0.13));
  },
  pop(t) {
    _tone(700 + Math.random() * 400, t, 0.06, 'sine', 0.2, null, 200);
  },
  ui(t) { _tone(660, t, 0.09, 'square', 0.05); _tone(990, t + 0.02, 0.09, 'sine', 0.07); },
  uiBig(t) { _tone(523, t, 0.14, 'triangle', 0.10); _tone(784, t + 0.06, 0.3, 'sine', 0.10); },
  whoosh(t) { _noiseBurst(t, 0.4, 0.14, 200, 2600, 0.7); },
  thud(t) { _tone(70, t, 0.4, 'sine', 0.4, null, 38); _noiseBurst(t, 0.3, 0.2, 300, 60, 0.8); },
  drip(t) { _tone(1400, t, 0.13, 'sine', 0.14, null, 500); },
  bubble(t) { _tone(300 + Math.random() * 500, t, 0.14, 'sine', 0.10, null, 1200); },
  fire(t) { _noiseBurst(t, 0.7, 0.10, 120, 700, 0.5); },
  wire(t) { _tone(1800, t, 0.18, 'triangle', 0.07, null, 2400); },
  shrink(t) { _tone(500, t, 0.5, 'sine', 0.18, null, 180); _noiseBurst(t, 0.4, 0.12, 800, 200, 1.4); },
  grow(t) { _tone(180, t, 0.5, 'sine', 0.18, null, 620); },
};

Sound.play = function (name, opts) {
  if (!Sound.ready || Sound.muted) return;
  const fn = SFX[name];
  if (!fn) return;
  fn(Sound.ctx.currentTime + 0.001, opts);
};

/* Character voice blips. Everyone speaks in beeps; the beeps have a soul. */
const VOICES = {
  norbert: { f: 300, type: 'sine', jit: 90, dur: 0.07, vol: 0.10 },
  gary: { f: 210, type: 'square', jit: 30, dur: 0.055, vol: 0.045 },
  pippa: { f: 520, type: 'triangle', jit: 200, dur: 0.09, vol: 0.07 },
  steve: { f: 130, type: 'sawtooth', jit: 18, dur: 0.075, vol: 0.035 },
  beans: { f: 155, type: 'sine', jit: 0, dur: 0.16, vol: 0.13 },
  glaze: { f: 660, type: 'sine', jit: 8, dur: 0.06, vol: 0.06 },
  council: { f: 240, type: 'square', jit: 120, dur: 0.05, vol: 0.05 },
  thumb: { f: 55, type: 'sine', jit: 6, dur: 0.4, vol: 0.22 },
  narrator: { f: 380, type: 'sine', jit: 40, dur: 0.05, vol: 0.045 },
};

Sound.blip = function (who) {
  if (!Sound.ready || Sound.muted) return;
  const v = VOICES[who] || VOICES.narrator;
  const t = Sound.ctx.currentTime + 0.001;
  const f = v.f + (Math.random() - 0.5) * v.jit;
  _tone(f, t, v.dur, v.type, v.vol);
  if (v.type !== 'sine') _tone(f * 2, t, v.dur * 0.6, 'sine', v.vol * 0.4);
};

/* ---- the music box ---------------------------------------------------- */

/* Each track: a key, a set of chords (semitones from the key), and a texture.
   The sequencer walks 16th notes and asks the track what to do with each. */
const TRACKS = {
  sill: {
    bpm: 74, root: 55, // G
    chords: [[0, 4, 7, 11], [-3, 2, 5, 9], [-5, 0, 4, 7], [2, 5, 9, 12]],
    arp: [0, 2, 1, 3, 2, 1], arpEvery: 2, bell: 0.10, padVol: 0.055, bassVol: 0.10,
  },
  table: {
    bpm: 88, root: 58, // Bb
    chords: [[0, 3, 7, 10], [-2, 3, 5, 10], [-4, 0, 3, 7], [-2, 2, 5, 9]],
    arp: [0, 1, 2, 3, 2, 1], arpEvery: 2, bell: 0.095, padVol: 0.05, bassVol: 0.11, pluck: true,
  },
  paint: {
    bpm: 104, root: 62, // D
    chords: [[0, 4, 7, 14], [5, 9, 12, 16], [-3, 4, 7, 12], [2, 7, 11, 14]],
    arp: [0, 2, 3, 1, 2, 0], arpEvery: 1, bell: 0.085, padVol: 0.04, bassVol: 0.10, pluck: true,
  },
  sink: {
    bpm: 66, root: 51, // Eb
    chords: [[0, 3, 7, 10], [-5, 2, 7, 10], [-2, 3, 6, 10], [0, 5, 7, 12]],
    arp: [0, 3, 1, 2], arpEvery: 3, bell: 0.075, padVol: 0.07, bassVol: 0.09, drip: true,
  },
  kiln: {
    bpm: 96, root: 49, // Db
    chords: [[0, 3, 7], [1, 5, 8], [-1, 3, 6], [0, 4, 7]],
    arp: [0, 1, 2, 1], arpEvery: 1, bell: 0.06, padVol: 0.10, bassVol: 0.15, tense: true,
  },
  dawn: {
    bpm: 60, root: 60, // C
    chords: [[0, 4, 7, 11], [-3, 2, 5, 9], [-5, 0, 4, 9], [-1, 2, 7, 11]],
    arp: [0, 1, 2, 3, 2, 1], arpEvery: 2, bell: 0.12, padVol: 0.075, bassVol: 0.08,
  },
  title: {
    bpm: 70, root: 57,
    chords: [[0, 3, 7, 10], [-2, 3, 7, 12], [-4, 0, 3, 8], [-5, 2, 7, 10]],
    arp: [0, 2, 1, 3], arpEvery: 2, bell: 0.115, padVol: 0.065, bassVol: 0.10,
  },
};

function midi2f(m) { return 440 * Math.pow(2, (m - 69) / 12); }

Sound.music = function (key) {
  if (!Sound.ready) { Sound._pending = key; return; }
  if (Sound._musicKey === key) return;
  Sound._musicKey = key;
  const trk = TRACKS[key];
  Sound._music = trk || null;
  Sound._step = 0;
  Sound._next = Sound.ctx.currentTime + 0.05;
  /* dip the volume through the change so it doesn't snap */
  const g = Sound.musicGain.gain, now = Sound.ctx.currentTime;
  g.cancelScheduledValues(now);
  g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(0.0001, now + 0.35);
  g.linearRampToValueAtTime(Sound.volMusic, now + 1.4);
};

Sound.stopMusic = function () {
  if (!Sound.ready) return;
  Sound._musicKey = null; Sound._music = null;
  const g = Sound.musicGain.gain, now = Sound.ctx.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(0.0001, now + 0.6);
};

Sound._schedule = function () {
  if (!Sound.ready || !Sound._music) return;
  const c = Sound.ctx;
  const trk = Sound._music;
  const spb = 60 / trk.bpm / 4;         // one sixteenth
  while (Sound._next < c.currentTime + 0.2) {
    const t = Sound._next;
    const s = Sound._step;
    const bar = Math.floor(s / 16) % trk.chords.length;
    const chord = trk.chords[bar];
    const beat = s % 16;

    /* bass on 1 and (softly) on the and-of-3 */
    if (beat === 0 || beat === 11) {
      const f = midi2f(trk.root + chord[0] - 12);
      const o = c.createOscillator(); o.type = 'triangle';
      o.frequency.value = f;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const g = c.createGain();
      const v = trk.bassVol * (beat === 0 ? 1 : 0.45);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (beat === 0 ? 1.5 : 0.6));
      o.connect(lp); lp.connect(g); g.connect(Sound.musicGain);
      o.start(t); o.stop(t + 1.7);
    }

    /* the music box: sine bells with a fast decay and an octave shimmer */
    if (s % trk.arpEvery === 0) {
      const idx = Math.floor(s / trk.arpEvery) % trk.arp.length;
      let deg = trk.arp[idx];
      const oct = (Math.floor(s / 16) % 2) && idx === 0 ? 12 : 0;
      const note = trk.root + chord[deg % chord.length] + 12 + oct;
      const f = midi2f(note);
      const dur = 1.5;
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.004;
      const g = c.createGain(); const g2 = c.createGain();
      const v = trk.bell * (idx === 0 ? 1 : 0.66);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(v * 0.30, t + 0.005);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.35);
      o.connect(g); o2.connect(g2);
      g.connect(Sound.musicGain); g2.connect(Sound.musicGain);
      o.start(t); o.stop(t + dur + 0.1);
      o2.start(t); o2.stop(t + dur * 0.4 + 0.1);
    }

    /* pad: two detuned saws under a slow filter, felt more than heard */
    if (beat === 0) {
      for (let i = 0; i < chord.length; i++) {
        const f = midi2f(trk.root + chord[i]);
        for (const det of [-4, 4]) {
          const o = c.createOscillator(); o.type = 'sawtooth';
          o.frequency.value = f; o.detune.value = det;
          const lp = c.createBiquadFilter(); lp.type = 'lowpass';
          lp.frequency.setValueAtTime(320, t);
          lp.frequency.linearRampToValueAtTime(760, t + 1.2);
          lp.Q.value = 2;
          const g = c.createGain();
          const dur = spb * 16;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(trk.padVol / chord.length, t + dur * 0.35);
          g.gain.linearRampToValueAtTime(0.0001, t + dur * 1.02);
          o.connect(lp); lp.connect(g); g.connect(Sound.musicGain);
          o.start(t); o.stop(t + dur * 1.1);
        }
      }
    }

    /* texture per room */
    if (trk.pluck && (beat === 6 || beat === 14)) {
      const f = midi2f(trk.root + chord[(beat / 2) % chord.length] + 24);
      _tone(f, t, 0.25, 'triangle', 0.035, Sound.musicGain);
    }
    if (trk.drip && beat === 8 && Math.random() > 0.4) {
      _tone(1500, t, 0.16, 'sine', 0.035, Sound.musicGain, 620);
    }
    if (trk.tense && (beat === 0 || beat === 8)) {
      const s2 = c.createBufferSource(); s2.buffer = Sound._noise; s2.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 90; bp.Q.value = 0.6;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      s2.connect(bp); bp.connect(g); g.connect(Sound.musicGain);
      s2.start(t); s2.stop(t + 1);
    }

    Sound._next += spb;
    Sound._step++;
  }
};

/* ---- particles -------------------------------------------------------- */

const FX = {
  parts: [],
  texts: [],
};

FX.clear = function () { FX.parts.length = 0; FX.texts.length = 0; };

FX.spawn = function (o) {
  if (FX.parts.length > 700) FX.parts.shift();
  FX.parts.push(Object.assign({
    x: 0, y: 0, vx: 0, vy: 0, r: 2, life: 1, max: 1, g: 300, drag: 0.6,
    color: '#c5704a', kind: 'crumb', rot: Math.random() * TAU, vrot: shash1(Math.random() * 99) * 6,
    fade: true,
  }, o));
};

/* torn clay: chunky, tumbling, bounces once */
FX.crumbs = function (x, y, n, color, force) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * 0.5 + shash1(i * 3.1 + x) * 2.2;
    const s = (force || 90) * (0.35 + Math.random() * 0.9);
    FX.spawn({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
      r: 1.2 + Math.random() * 2.8, life: 0.6 + Math.random() * 0.7,
      max: 1.3, color: color || NB_SKIN, kind: 'crumb', g: 620, drag: 0.2,
    });
  }
};

/* a soft round puff, for landings and doors */
FX.puff = function (x, y, n, color, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const s = (spread || 40) * Math.random();
    FX.spawn({
      x: x + Math.cos(a) * 4, y: y + Math.sin(a) * 2,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.5 - 18,
      r: 3 + Math.random() * 7, life: 0.4 + Math.random() * 0.5, max: 0.9,
      color: color || '#d8cdb8', kind: 'puff', g: -30, drag: 2.6,
    });
  }
};

FX.splash = function (x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * 0.5 + shash1(i * 7.7 + y) * 1.9;
    const s = 60 + Math.random() * 150;
    FX.spawn({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      r: 1 + Math.random() * 2.6, life: 0.5 + Math.random() * 0.5, max: 1,
      color: color || '#9fd0e0', kind: 'drop', g: 520, drag: 0.1,
    });
  }
};

FX.sparkle = function (x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const s = 20 + Math.random() * 70;
    FX.spawn({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
      r: 1 + Math.random() * 2.2, life: 0.5 + Math.random() * 0.8, max: 1.3,
      color: color || '#ffe6a8', kind: 'star', g: 40, drag: 1.4,
    });
  }
};

FX.heart = function (x, y) {
  FX.spawn({
    x: x + shash1(Math.random() * 9) * 6, y, vx: shash1(Math.random() * 5) * 12, vy: -34,
    r: 4, life: 1.3, max: 1.3, color: '#f07a9c', kind: 'heart', g: -12, drag: 1.1,
  });
};

FX.note = function (x, y) {
  FX.spawn({
    x, y, vx: shash1(Math.random() * 5) * 16, vy: -30,
    r: 4, life: 1.5, max: 1.5, color: '#ffeecb', kind: 'note', g: -8, drag: 1.0,
  });
};

FX.text = function (x, y, str, color) {
  FX.texts.push({ x, y, str, color: color || '#fff2d8', life: 1.5, max: 1.5 });
};

FX.update = function (dt) {
  for (let i = FX.parts.length - 1; i >= 0; i--) {
    const p = FX.parts[i];
    p.life -= dt;
    if (p.life <= 0) { FX.parts.splice(i, 1); continue; }
    p.vy += p.g * dt;
    const d = Math.exp(-p.drag * dt);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vrot * dt;
  }
  for (let i = FX.texts.length - 1; i >= 0; i--) {
    const t = FX.texts[i];
    t.life -= dt; t.y -= dt * 22;
    if (t.life <= 0) FX.texts.splice(i, 1);
  }
};

FX.draw = function (ctx) {
  for (const p of FX.parts) {
    const a = p.fade ? clamp(p.life / p.max, 0, 1) : 1;
    ctx.globalAlpha = a;
    switch (p.kind) {
      case 'crumb': {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        Clay.blob(ctx, { x: 0, y: 0, rx: p.r, ry: p.r * 0.78, seed: p.r * 31, color: p.color, wob: 0.25, prints: 0, spec: false });
        ctx.restore();
        break;
      }
      case 'puff': {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (2 - a));
        g.addColorStop(0, rgba(p.color, 0.34 * a));
        g.addColorStop(1, rgba(p.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (2 - a), 0, TAU); ctx.fill();
        break;
      }
      case 'drop': {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.r * 0.7, p.r * 1.35, Math.atan2(p.vy, p.vx) - 1.57, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(p.x - p.r * 0.2, p.y - p.r * 0.3, p.r * 0.28, 0, TAU); ctx.fill();
        break;
      }
      case 'star': {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        for (let k = 0; k < 4; k++) {
          const ang = (k / 4) * TAU;
          ctx.lineTo(Math.cos(ang) * p.r * 1.9, Math.sin(ang) * p.r * 1.9);
          ctx.lineTo(Math.cos(ang + 0.785) * p.r * 0.45, Math.sin(ang + 0.785) * p.r * 0.45);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      }
      case 'heart': {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.life * 6) * 0.2);
        ctx.fillStyle = p.color;
        const r = p.r;
        ctx.beginPath();
        ctx.moveTo(0, r * 0.7);
        ctx.bezierCurveTo(-r * 1.5, -r * 0.4, -r * 0.5, -r * 1.3, 0, -r * 0.35);
        ctx.bezierCurveTo(r * 0.5, -r * 1.3, r * 1.5, -r * 0.4, 0, r * 0.7);
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'note': {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.life * 4) * 0.25);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(-1.5, 2.5, 2.6, 1.9, -0.4, 0, TAU); ctx.fill();
        ctx.fillRect(0.7, -5, 1.2, 7.5);
        ctx.beginPath(); ctx.moveTo(0.7, -5); ctx.quadraticCurveTo(5, -5.5, 4.4, -1.5);
        ctx.quadraticCurveTo(3.6, -3.6, 0.7, -2.8); ctx.closePath(); ctx.fill();
        ctx.restore();
        break;
      }
    }
  }
  ctx.globalAlpha = 1;
};

FX.drawText = function (ctx) {
  for (const t of FX.texts) {
    const a = clamp(t.life / t.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '700 11px ' + UI_FONT;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(28,14,26,0.8)';
    ctx.strokeText(t.str, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, t.x, t.y);
    ctx.restore();
  }
};

/* ---- camera ----------------------------------------------------------- */

const Cam = {
  x: 0, y: 0, tx: 0, ty: 0,
  shake: 0, shakeD: 0,
  offX: 0, offY: 0,
  bounds: null,
  lead: 0,
};

Cam.follow = function (px, py, facing, dt, W, H, speed) {
  Cam.lead = approach(Cam.lead, facing * 46, 90 * dt);
  Cam.tx = px + Cam.lead - W / 2;
  Cam.ty = py - H * 0.62;
  const k = 1 - Math.exp(-(speed || 5.5) * dt);
  Cam.x += (Cam.tx - Cam.x) * k;
  Cam.y += (Cam.ty - Cam.y) * k;
  Cam.clamp(W, H);
};

Cam.snap = function (px, py, W, H) {
  Cam.x = px - W / 2; Cam.y = py - H * 0.62; Cam.lead = 0;
  Cam.clamp(W, H);
};

Cam.clamp = function (W, H) {
  const b = Cam.bounds;
  if (!b) return;
  if (b.w <= W) Cam.x = b.x + (b.w - W) / 2;
  else Cam.x = clamp(Cam.x, b.x, b.x + b.w - W);
  if (b.h <= H) Cam.y = b.y + (b.h - H) / 2;
  else Cam.y = clamp(Cam.y, b.y, b.y + b.h - H);
};

Cam.kick = function (amount) { Cam.shake = Math.max(Cam.shake, amount); };

Cam.update = function (dt) {
  if (Cam.shake > 0) {
    Cam.shake = Math.max(0, Cam.shake - dt * (12 + Cam.shake * 2));
    Cam.offX = shash1(Clay.frame * 7.3 + performance.now() * 0.01) * Cam.shake;
    Cam.offY = shash1(Clay.frame * 3.1 + performance.now() * 0.013) * Cam.shake;
  } else { Cam.offX = 0; Cam.offY = 0; }
};

Cam.viewX = function () { return Math.round((Cam.x + Cam.offX) * 4) / 4; };
Cam.viewY = function () { return Math.round((Cam.y + Cam.offY) * 4) / 4; };

/* ---- scene transitions ------------------------------------------------ */

/* A wipe made of overlapping clay blobs rolling across the screen, because a
   plain black fade would be the one un-handmade thing in the whole game. */
const Wipe = {
  t: 0, dir: 0, dur: 0.72, cb: null, active: false, color: '#2a1626',
};

Wipe.go = function (cb, color) {
  if (Wipe.active) return;
  Wipe.active = true; Wipe.t = 0; Wipe.dir = 1; Wipe.cb = cb;
  Wipe.color = color || '#2a1626';
};

Wipe.update = function (dt) {
  if (!Wipe.active) return;
  const step = dt / Wipe.dur;
  if (Wipe.dir === 1) {
    Wipe.t += step;
    if (Wipe.t >= 1) {
      Wipe.t = 1;
      Wipe.dir = -1;
      if (Wipe.cb) { Wipe.cb(); Wipe.cb = null; }
    }
  } else {
    Wipe.t -= step * 1.4;              /* pull back a little faster than it came */
    if (Wipe.t <= 0) { Wipe.t = 0; Wipe.active = false; Wipe.dir = 0; }
  }
};

Wipe.draw = function (ctx, W, H) {
  if (!Wipe.active) return;
  const p = smootherstep(clamp(Wipe.t, 0, 1));
  const rows = 7;
  ctx.save();
  for (let r = 0; r < rows; r++) {
    const off = (r % 2 ? 0.10 : 0) + hash1(r * 3.1) * 0.10;
    const q = clamp((p - off) / (1 - off), 0, 1);
    const w = q * (W + 220);
    if (w <= 0) continue;
    const y0 = (r / rows) * H, y1 = ((r + 1) / rows) * H;
    ctx.beginPath();
    ctx.moveTo(-20, y0 - 2);
    ctx.lineTo(w - 100, y0 - 2);
    const n = 6;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const yy = lerp(y0, y1, t);
      const bulge = Math.sin(t * Math.PI) * 42 + shash1(i * 3 + r) * 12;
      ctx.lineTo(w - 100 + bulge, yy);
    }
    ctx.lineTo(-20, y1 + 2);
    ctx.closePath();
    ctx.fillStyle = r % 2 ? Wipe.color : coolShade(Wipe.color, 0.2);
    ctx.fill();
  }
  ctx.restore();
};


/* ===== src/input.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  input.js
   Keyboard, gamepad, and the on-screen controls.

   The touch pad is real DOM buttons rather than rectangles painted into the
   canvas. That gets safe-area insets, crisp text and correct hit testing for
   free, and it means the d-pad can live below the picture in portrait and
   float over the corners in landscape without the game knowing anything
   about it.

   Touches are resolved with elementFromPoint on every move rather than with
   pointer capture, so you can roll your thumb from LEFT to RIGHT without
   lifting it -- which is how people actually play platformers on a phone.
   ========================================================================= */

const Input = {
  held: {}, pressed: {}, released: {},
  touch: false,
  anyKey: false,
  _btns: {},
};

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  Space: 'jump',
  KeyJ: 'lob', KeyZ: 'lob',
  KeyK: 'slurp', KeyX: 'slurp',
  KeyE: 'talk', Enter: 'talk',
  Escape: 'pause', KeyP: 'pause',
  KeyM: 'mute',
};

Input.press = function (a) {
  if (!a) return;
  if (!Input.held[a]) Input.pressed[a] = true;
  Input.held[a] = true;
  Input._paint(a, true);
};

Input.release = function (a) {
  if (!a) return;
  if (Input.held[a]) Input.released[a] = true;
  Input.held[a] = false;
  Input._paint(a, false);
};

Input._paint = function (a, on) {
  const list = Input._btns[a];
  if (list) for (const el of list) el.classList.toggle('on', on);
};

/* ---------------------------------------------------------------------- */

Input.attach = function (canvas) {
  /* ---- keyboard ---- */
  addEventListener('keydown', (e) => {
    Input.anyKey = true;
    const a = KEYMAP[e.code];
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    if (a) Input.press(a);
  });
  addEventListener('keyup', (e) => {
    const a = KEYMAP[e.code];
    if (a) Input.release(a);
  });
  addEventListener('blur', () => {
    for (const a in Input.held) Input.release(a);
  });

  /* ---- on-screen buttons ---- */
  for (const el of document.querySelectorAll('[data-act]')) {
    const a = el.dataset.act;
    (Input._btns[a] || (Input._btns[a] = [])).push(el);
  }

  const actAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const hit = el && el.closest ? el.closest('[data-act]') : null;
    return hit ? hit.dataset.act : null;
  };

  /* which action each live finger is currently over */
  const fingers = new Map();

  const refresh = (touches) => {
    for (const t of touches) {
      const want = actAt(t.clientX, t.clientY) || (t.onCanvas ? 'talk' : null);
      const have = fingers.get(t.identifier);
      if (want === have) continue;
      if (have) Input.release(have);
      if (want) Input.press(want);
      if (want) fingers.set(t.identifier, want); else fingers.delete(t.identifier);
    }
  };

  const onStart = (e) => {
    Input.touch = true;
    Input.anyKey = true;
    document.body.classList.add('touch');
    for (const t of e.changedTouches) {
      const a = actAt(t.clientX, t.clientY);
      /* a tap anywhere that isn't a button means "go on, then" */
      const act = a || 'talk';
      Input.press(act);
      fingers.set(t.identifier, act);
    }
    if (e.cancelable) e.preventDefault();
  };

  const onMove = (e) => {
    /* only re-target fingers that started on the pad; a finger that began on
       the picture keeps meaning "advance", however far it wanders */
    for (const t of e.changedTouches) {
      if (!fingers.has(t.identifier)) continue;
      const cur = fingers.get(t.identifier);
      if (cur === 'talk') continue;
      const want = actAt(t.clientX, t.clientY);
      if (want === cur) continue;
      Input.release(cur);
      if (want) { Input.press(want); fingers.set(t.identifier, want); }
      else fingers.delete(t.identifier);
    }
    if (e.cancelable) e.preventDefault();
  };

  const onEnd = (e) => {
    for (const t of e.changedTouches) {
      const a = fingers.get(t.identifier);
      if (a) { Input.release(a); fingers.delete(t.identifier); }
    }
    if (e.cancelable) e.preventDefault();
  };

  document.addEventListener('touchstart', onStart, { passive: false });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onEnd, { passive: false });
  document.addEventListener('touchcancel', onEnd, { passive: false });

  /* mouse, so the pad is testable on a desktop and the canvas is clickable */
  let mouseAct = null;
  document.addEventListener('mousedown', (e) => {
    if (Input.touch) return;
    Input.anyKey = true;
    mouseAct = actAt(e.clientX, e.clientY) || 'talk';
    Input.press(mouseAct);
    e.preventDefault();
  });
  addEventListener('mouseup', () => {
    if (mouseAct) { Input.release(mouseAct); mouseAct = null; }
  });

  /* context menu on long-press is never what you wanted mid-jump */
  document.addEventListener('contextmenu', (e) => e.preventDefault());
};

/* Show the pad up front on anything without a keyboard, rather than waiting
   for the first touch and popping the layout about. */
Input.detectTouch = function () {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const noHover = matchMedia('(hover: none)').matches;
  if (coarse || noHover || navigator.maxTouchPoints > 0) {
    Input.touch = true;
    document.body.classList.add('touch');
  }
};

Input.gamepad = function () {
  if (!navigator.getGamepads) return;
  let gp = null;
  for (const g of navigator.getGamepads()) if (g) { gp = g; break; }
  if (!gp) return;
  const b = gp.buttons, ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const set = (a, on) => { if (on) Input.press(a); else if (Input._gp && Input._gp[a]) Input.release(a); };
  const st = Input._gp || (Input._gp = {});
  const map = {
    left: ax < -0.4 || (b[14] && b[14].pressed),
    right: ax > 0.4 || (b[15] && b[15].pressed),
    up: ay < -0.5 || (b[12] && b[12].pressed),
    down: ay > 0.5 || (b[13] && b[13].pressed),
    jump: b[0] && b[0].pressed,
    lob: b[2] && b[2].pressed,
    slurp: b[1] && b[1].pressed,
    talk: (b[3] && b[3].pressed) || (b[0] && b[0].pressed),
    pause: b[9] && b[9].pressed,
  };
  for (const a in map) { set(a, !!map[a]); st[a] = !!map[a]; }
};

Input.endFrame = function () {
  Input.pressed = {}; Input.released = {};
  Input.anyKey = false;
};

Input.axis = function () {
  return (Input.held.right ? 1 : 0) - (Input.held.left ? 1 : 0);
};


/* ===== src/norbert.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  norbert.js
   The rig for our hero.

   Norbert was made in forty minutes by a nine-year-old named Ivy, who ran out
   of orange clay, ran out of time, and had to be picked up at five. So:
     - one arm is a long clay noodle, the other is a nub with the armature wire
       still poking out of it
     - his left eye is a shirt button, his right eye is a bead, and they do not
       match in size, height, or opinion
     - there is a thumbprint dent in his forehead where she pressed too hard
     - the patch on his belly is grey, because that was the clay that was left
     - he has a little pinched curl on top that she was quite proud of
   None of this is symmetrical. None of it is meant to be.
   ========================================================================= */

const NB_SKIN = '#c5704a';            // terracotta
const NB_PATCH = '#8d8b83';           // the grey clay she had left
const NB_WIRE = '#9aa0a6';

/* Fresh state object for the rig. The game mutates this; drawing never does. */
function makeNorbertRig() {
  return {
    facing: 1,
    walk: 0,            // walk cycle phase
    speed: 0,           // 0..1 how fast he's trundling
    sx: 1, sy: 1,       // squash & stretch springs
    vsx: 0, vsy: 0,
    squish: 0,          // 0..1 pancake
    stretch: 0,         // 0..1 tall & thin
    scale: 1,           // shrinks as he gives himself away
    air: 0,             // -1 rising, 1 falling, 0 grounded
    blink: 0,
    blinkT: 1.5,
    look: { x: 0, y: 0 },
    mood: 'neutral',
    armSwing: 0,
    reach: null,        // {x,y} world-ish local target for the long arm
    curl: { a: 0, v: 0 },   // the pinched curl on his head, on a spring
    jiggle: 0,
    dizzy: 0,
    wet: 0,             // dripping in the sink
    paint: null,        // gets dyed in the paint shelf
    t: 0,
  };
}

function updateNorbertRig(n, dt) {
  n.t += dt;

  /* squash & stretch spring back to the pose the player is holding */
  const tsx = 1 + n.squish * 0.52 - n.stretch * 0.26;
  const tsy = 1 - n.squish * 0.56 + n.stretch * 0.72;
  const K = 190, D = 15;
  n.vsx += (tsx - n.sx) * K * dt; n.vsx *= Math.exp(-D * dt); n.sx += n.vsx * dt;
  n.vsy += (tsy - n.sy) * K * dt; n.vsy *= Math.exp(-D * dt); n.sy += n.vsy * dt;

  /* the curl swings against the direction of travel, half a beat late */
  const target = -n.facing * n.speed * 0.5 - n.air * 0.35;
  n.curl.v += (target - n.curl.a) * 60 * dt;
  n.curl.v *= Math.exp(-7 * dt);
  n.curl.a += n.curl.v * dt;

  n.walk += n.speed * dt * 9.5;
  n.armSwing = Math.sin(n.walk) * n.speed;

  n.blinkT -= dt;
  if (n.blinkT <= 0) { n.blink = 0.13; n.blinkT = 1.4 + Math.random() * 3.4; }
  if (n.blink > 0) n.blink -= dt;

  if (n.dizzy > 0) n.dizzy -= dt;
  if (n.wet > 0) n.wet -= dt * 0.35;
  n.jiggle *= Math.exp(-6 * dt);
}

/* ---------------------------------------------------------------------- */

function drawNorbert(ctx, n, x, y) {
  const skin = n.paint ? mixHex(NB_SKIN, n.paint, 0.82) : NB_SKIN;
  const patch = n.paint ? mixHex(NB_PATCH, n.paint, 0.6) : NB_PATCH;
  const S = n.scale;

  /* stop-motion boil: the model was nudged between frames */
  const bx = shash1(Clay.frame * 1.7 + 11) * 0.45;
  const by = shash1(Clay.frame * 2.3 + 27) * 0.4;
  const brot = shash1(Clay.frame * 1.1 + 5) * 0.012;

  Clay.groundShadow(ctx, x, y + 1, 15 * S * n.sx, 4.6 * S, 0.4);

  ctx.save();
  ctx.translate(x + bx, y + by);
  ctx.rotate(brot + n.dizzy * 0.1 * Math.sin(n.t * 20));
  ctx.scale(n.facing * n.sx * S, n.sy * S);

  const bob = Math.abs(Math.sin(n.walk)) * 1.6 * n.speed;
  ctx.translate(0, -bob * 0.4);

  const sq = n.squish, st = n.stretch;
  const bodyY = -19 + bob * 0.3;
  const headY = -36.5 + bob * 0.55 - st * 1.5;
  const bodyRX = 13.2, bodyRY = 13.6;
  const headRX = 10.2, headRY = 9.6;

  /* ---- back leg ---- */
  const legPhase = n.walk;
  const l1 = Math.sin(legPhase) * 3.4 * n.speed;
  const l2 = Math.sin(legPhase + Math.PI) * 3.4 * n.speed;
  const legLift1 = Math.max(0, Math.sin(legPhase)) * 2.2 * n.speed;
  const legLift2 = Math.max(0, Math.sin(legPhase + Math.PI)) * 2.2 * n.speed;

  /* the right leg is shorter. Ivy noticed and decided it was fine. */
  drawNbLeg(ctx, 5.2, -9, 5.6 + l2, -1.6 - legLift2, 3.0, 4.6, 2.6, skin, 31);

  /* ---- the nub arm, behind the body ---- */
  const nubX = 10.8, nubY = -25.5 + bob * 0.3;
  ctx.save();
  ctx.translate(nubX, nubY);
  ctx.rotate(0.22 + n.armSwing * 0.22);
  /* the armature wire is still in there. It curls, hopefully, into nothing. */
  const wire = (col, lw, oy) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(2.2, 0.4 + oy);
    ctx.quadraticCurveTo(5.6, -0.4 + oy, 5.9, -2.6 + oy);
    ctx.quadraticCurveTo(6.1, -4.4 + oy, 4.5, -4.5 + oy);
    ctx.stroke();
  };
  wire('rgba(40,24,36,0.45)', 1.9, 0.7);
  wire(NB_WIRE, 1.0, 0);
  wire('rgba(255,255,255,0.5)', 0.4, -0.35);
  ctx.restore();
  Clay.blob(ctx, { x: nubX, y: nubY, rx: 4.5, ry: 3.9, seed: 44, color: skin, wob: 0.15, boil: 0.5, rot: 0.3, prints: 1 });

  /* ---- body ---- */
  /* pear shaped: he settles under his own weight, like clay does */
  Clay.blobPath(ctx, 0, bodyY + 1.6, bodyRX * (1 + sq * 0.05), bodyRY, 7, 0.085, 0, 0.35, 24);
  Clay.material(ctx, { x: -bodyRX * 1.2, y: bodyY - bodyRY * 1.2, w: bodyRX * 2.4, h: bodyRY * 2.5 },
    skin, { seed: 7, prints: 4, specX: 0.28, specY: 0.22 });

  /* the grey patch on his belly */
  ctx.save();
  Clay.blobPath(ctx, 0, bodyY + 1.6, bodyRX * (1 + sq * 0.05), bodyRY, 7, 0.085, 0, 0.35, 24);
  ctx.clip();
  Clay.blobPath(ctx, -2.4, bodyY + 6.4, 6.6, 4.6, 88, 0.2, -0.2, 0.4, 16);
  Clay.material(ctx, { x: -10, y: bodyY + 1, w: 16, h: 11 }, patch,
    { seed: 88, prints: 2, edgeAlpha: 0.22, hotspot: false });
  ctx.restore();

  /* the seam where head meets body -- she pressed them together, you can tell */
  ctx.strokeStyle = rgba(coolShade(skin, 0.5), 0.28);
  ctx.lineWidth = 1.1; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-7.6, headY + headRY * 0.72);
  ctx.quadraticCurveTo(0, headY + headRY * 1.06, 7.2, headY + headRY * 0.66);
  ctx.stroke();

  /* ---- front leg ---- */
  drawNbLeg(ctx, -5.4, -9, -5.8 + l1, -1.4 - legLift1, 3.2, 5.4, 2.9, skin, 17);

  /* ---- head ---- */
  const headTilt = n.facing * 0.04 + n.armSwing * 0.03 + shash1(Clay.frame * 0.9 + 3) * 0.01;
  ctx.save();
  ctx.translate(0, headY);
  ctx.rotate(headTilt);

  /* the pinched curl */
  drawNbCurl(ctx, 0.8, -headRY + 0.6, n.curl.a, skin);

  Clay.blobPath(ctx, 0, 0, headRX, headRY, 3, 0.075, 0.05, 0.35, 22);
  Clay.material(ctx, { x: -headRX * 1.15, y: -headRY * 1.15, w: headRX * 2.3, h: headRY * 2.3 },
    skin, { seed: 3, prints: 3, specX: 0.26, specY: 0.2 });

  /* the thumbprint dent in his forehead */
  Clay.dent(ctx, -2.6, -5.4, 3.9, 2.5, -0.28, skin);
  ctx.strokeStyle = rgba(warmLight(skin, 0.5), 0.3); ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.arc(-2.6, -5.4, 3.2, 0.9, 3.6); ctx.stroke();

  drawNbFace(ctx, n, headRX, headRY, skin);

  ctx.restore();

  /* ---- the long arm, in front. It is much too long and he knows it. ---- */
  const shX = -11.6, shY = -26.5 + bob * 0.3;
  let hx, hy, bow;
  if (n.reach) {
    hx = n.reach.x; hy = n.reach.y; bow = 2;
  } else {
    hx = shX - 5.4 + n.armSwing * 6.4;
    hy = -5.4 + Math.abs(n.armSwing) * -1.8 + (n.air ? 5 * n.air : 0);
    bow = -4.6 - n.armSwing * 3.0;
  }
  /* shoulder ball, so the arm doesn't look glued on (it is glued on) */
  Clay.blob(ctx, { x: shX + 1.4, y: shY + 0.6, rx: 4.0, ry: 4.2, seed: 66, color: skin, wob: 0.12, boil: 0.4, prints: 1 });
  Clay.limb(ctx, shX, shY, hx, hy, 3.3, 2.5, skin, { seed: 21, bow: bow, prints: 2, edgeAlpha: 0.5 });
  /* a hand, of sorts. Three fingers, because forty minutes is forty minutes. */
  Clay.blob(ctx, { x: hx, y: hy, rx: 3.4, ry: 3.1, seed: 22, color: skin, wob: 0.19, boil: 0.6, prints: 1 });
  ctx.strokeStyle = rgba(coolShade(skin, 0.45), 0.32); ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(hx - 1.4, hy + 1.6); ctx.lineTo(hx - 1.9, hy + 3.4);
  ctx.moveTo(hx + 0.2, hy + 2.0); ctx.lineTo(hx + 0.1, hy + 3.9);
  ctx.moveTo(hx + 1.7, hy + 1.4); ctx.lineTo(hx + 2.3, hy + 3.1);
  ctx.stroke();

  /* wet clay drips in the sink */
  if (n.wet > 0.02) {
    ctx.fillStyle = 'rgba(178,206,214,' + (0.4 * clamp(n.wet, 0, 1)) + ')';
    for (let i = 0; i < 4; i++) {
      const p = (n.t * 1.4 + i * 0.31) % 1;
      const dx2 = -8 + i * 5.4 + shash1(i * 3) * 2;
      ctx.beginPath();
      ctx.ellipse(dx2, -4 + p * 6, 0.9, 1.6 + p * 1.2, 0, 0, TAU);
      ctx.fill();
    }
  }

  ctx.restore();
}

/* stubby leg + flat foot */
function drawNbLeg(ctx, hx, hy, fx, fy, r, footRX, footRY, color, seed) {
  Clay.limb(ctx, hx, hy, fx, fy, r, r * 0.86, color, { seed: seed, bow: 0.8, prints: 1 });
  Clay.blob(ctx, {
    x: fx - 0.8, y: fy, rx: footRX, ry: footRY, seed: seed + 100,
    color: color, wob: 0.17, boil: 0.4, rot: -0.06, prints: 1
  });
}

/* the pinched curl on top of his head -- Ivy's favourite bit */
function drawNbCurl(ctx, x, y, a, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a * 0.5);
  const tipX = 2.6 + a * 4.2, tipY = -7.4 + Math.abs(a) * 1.4;
  Clay.limb(ctx, 0, 1, tipX, tipY, 2.5, 0.7, color, { seed: 55, bow: -2.4 - a * 1.6, prints: 0 });
  ctx.restore();
}

/* ---------------------------------------------------------------------- */
/*  Face                                                                    */
/* ---------------------------------------------------------------------- */

function drawNbFace(ctx, n, hrx, hry, skin) {
  const lookX = clamp(n.look.x, -1, 1), lookY = clamp(n.look.y, -1, 1);
  const blinking = n.blink > 0;

  /* left: the button. It is much too big and it is the best thing about him. */
  const bex = -4.2 + lookX * 0.7, bey = 0.6 + lookY * 0.7;
  if (blinking) {
    ctx.save();
    Clay.blobPath(ctx, bex, bey, 4.6, 1.1, 91, 0.14, -0.1, 0, 12);
    Clay.material(ctx, { x: bex - 5, y: bey - 2, w: 10, h: 4 }, skin, { seed: 91, prints: 0, edgeAlpha: 0.4 });
    ctx.restore();
  } else {
    Clay.buttonEye(ctx, bex, bey, 4.5, -0.16 + lookX * 0.1, { seed: 92 });
  }

  /* right: a bead. Set higher, because she was rushing. */
  const bdx = 4.9 + lookX * 0.5, bdy = -1.1 + lookY * 0.5;
  if (blinking) {
    ctx.strokeStyle = rgba(coolShade(skin, 0.5), 0.6); ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(bdx, bdy + 1, 2.2, 3.4, 6.0); ctx.stroke();
  } else {
    Clay.beadEye(ctx, bdx, bdy, 1.85, {});
  }

  /* a smudge of an eyebrow over the bead only. There was only enough for one. */
  ctx.strokeStyle = rgba(coolShade(skin, 0.45), 0.4);
  ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  const browY = -4.6 + (n.mood === 'worried' ? 0.6 : 0) + lookY * 0.4;
  ctx.beginPath();
  if (n.mood === 'worried' || n.mood === 'sad') ctx.arc(bdx + 0.4, browY + 3.4, 3.2, 4.3, 5.3);
  else if (n.mood === 'happy') ctx.arc(bdx + 0.2, browY + 4.2, 3.6, 3.9, 5.0);
  else ctx.arc(bdx + 0.3, browY + 3.8, 3.4, 4.1, 5.15);
  ctx.stroke();

  /* mouth: a groove pressed in with the end of a paintbrush */
  const mx = 0.4, my = 4.9;
  const dark = rgba(coolShade(skin, 0.55), 0.5);
  const lite = rgba(warmLight(skin, 0.5), 0.42);
  ctx.lineCap = 'round';
  const stroke2 = (fn) => {
    ctx.lineWidth = 1.9; ctx.strokeStyle = dark;
    ctx.save(); ctx.translate(0.5, 0.5); ctx.beginPath(); fn(); ctx.stroke(); ctx.restore();
    ctx.lineWidth = 1.3; ctx.strokeStyle = lite;
    ctx.save(); ctx.translate(-0.4, -0.5); ctx.beginPath(); fn(); ctx.stroke(); ctx.restore();
  };

  switch (n.mood) {
    case 'happy':
      stroke2(() => ctx.arc(mx, my - 1.4, 3.5, 0.5, 2.64));
      break;
    case 'oh':
      ctx.beginPath(); ctx.ellipse(mx, my + 0.4, 1.9, 2.4, 0, 0, TAU);
      ctx.fillStyle = rgba(coolShade(skin, 0.62), 0.75); ctx.fill();
      ctx.beginPath(); ctx.ellipse(mx - 0.4, my - 0.3, 1.5, 1.8, 0, 0, TAU);
      ctx.strokeStyle = lite; ctx.lineWidth = 0.9; ctx.stroke();
      break;
    case 'sad':
      stroke2(() => ctx.arc(mx, my + 4.0, 3.4, 3.85, 5.58));
      break;
    case 'worried':
      stroke2(() => { ctx.moveTo(mx - 3.2, my); ctx.quadraticCurveTo(mx - 1, my + 1.6, mx + 0.3, my - 0.1); ctx.quadraticCurveTo(mx + 1.8, my - 1.5, mx + 3.4, my + 0.4); });
      break;
    case 'grin':
      stroke2(() => ctx.arc(mx, my - 2.2, 4.4, 0.42, 2.72));
      ctx.fillStyle = 'rgba(252,246,232,0.9)';
      ctx.beginPath(); ctx.ellipse(mx - 1.2, my + 1.0, 1.1, 1.0, 0, 0, TAU); ctx.fill();
      break;
    default:
      stroke2(() => { ctx.moveTo(mx - 2.6, my - 0.4); ctx.quadraticCurveTo(mx, my + 1.0, mx + 2.8, my - 0.6); });
  }
}

/* ---------------------------------------------------------------------- */
/*  A torn-off piece of Norbert                                            */
/* ---------------------------------------------------------------------- */

function drawClayBlobEntity(ctx, b) {
  const c = b.color || NB_SKIN;
  Clay.groundShadow(ctx, b.x, b.y + b.r * 0.85, b.r * 1.5, b.r * 0.5, 0.35);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot || 0);
  ctx.scale(b.sx || 1, b.sy || 1);
  Clay.blob(ctx, {
    x: 0, y: 0, rx: b.r, ry: b.r * 0.92, seed: b.seed || 5, color: c,
    wob: 0.17, boil: 0.7, prints: 2
  });
  /* a tiny face, because everything here is a little bit alive */
  if (b.stuck) {
    Clay.beadEye(ctx, -b.r * 0.3, -b.r * 0.15, Math.max(0.8, b.r * 0.13), {});
    Clay.beadEye(ctx, b.r * 0.32, -b.r * 0.18, Math.max(0.8, b.r * 0.13), {});
  }
  ctx.restore();
}


/* ===== src/cast.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  cast.js
   Everyone else on the table.

   The material is the characterisation here. Gary is dry seed-pod. Pippa is
   fuzzy chenille. Beans is an undifferentiated lump. Steve is FIRED -- hard,
   glossy, finished, and he will tell you about it. And Glaze is drawn with
   the wobble and the thumbprints switched off entirely, because Glaze is
   perfect and that is the single worst thing about Glaze.
   ========================================================================= */

const CAST = {};

function makeNpc(kind, x, y, opts) {
  const n = Object.assign({
    kind, x, y, t: Math.random() * 10, facing: -1, talk: 0, mood: 'idle',
    seed: Math.floor(Math.random() * 1000), bobPhase: Math.random() * TAU,
    scale: 1, hidden: false, vy: 0, hop: 0,
  }, opts || {});
  return n;
}

function updateNpc(n, dt, player) {
  n.t += dt;
  if (n.talk > 0) n.talk -= dt;
  if (player && n.autoFace !== false) {
    n.facing = player.x < n.x ? -1 : 1;
  }
  if (n.hop > 0) n.hop -= dt;
}

function drawNpc(ctx, n) {
  if (n.hidden) return;
  const fn = CAST[n.kind];
  if (fn) fn(ctx, n, n.x, n.y);
}

/* Little speech-shake applied while a character is mid-line. */
function talkWobble(n) {
  return n.talk > 0 ? Math.sin(n.t * 26) * 0.035 : 0;
}

/* ======================================================================= */
/*  GARY -- a pinecone who is certain he is a distinguished gentleman      */
/* ======================================================================= */

CAST.gary = function (ctx, n, x, y) {
  const bob = Math.sin(n.t * 1.6 + n.bobPhase) * 1.4;
  const S = n.scale;
  Clay.groundShadow(ctx, x, y + 1, 15 * S, 4.4 * S, 0.4);
  ctx.save();
  ctx.translate(x, y - bob * 0.4);
  ctx.scale(n.facing * S, S);
  ctx.rotate(talkWobble(n) + Math.sin(n.t * 0.9) * 0.02);

  /* two extremely small twig legs */
  ctx.strokeStyle = '#4a3521'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-4, -6); ctx.lineTo(-5.5, -0.5);
  ctx.moveTo(4, -6); ctx.lineTo(5.5, -0.5);
  ctx.stroke();
  ctx.strokeStyle = '#6d5334'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-4, -6); ctx.lineTo(-5.5, -0.5);
  ctx.moveTo(4, -6); ctx.lineTo(5.5, -0.5);
  ctx.stroke();

  /* the cone: rows of scales, tightest at the top */
  const H = 44;
  for (let row = 0; row < 9; row++) {
    const rt = row / 8;
    const ry0 = -4 - rt * H;
    const rw = 13.5 * Math.sin((1 - rt) * 1.5 + 0.34) + 1.5;
    const count = Math.max(2, Math.round(5 - rt * 2.4));
    for (let i = 0; i < count; i++) {
      const u = count === 1 ? 0.5 : i / (count - 1);
      const sx = lerp(-rw, rw, u) * (0.86 + 0.14 * Math.sin(row));
      const scaleW = 5.4 - rt * 1.9, scaleH = 3.4 - rt * 1.0;
      const tone = ['#6b4a2b', '#7d5931', '#5c3f24'][(row + i) % 3];
      Clay.blob(ctx, {
        x: sx, y: ry0 + Math.abs(sx) * 0.10, rx: scaleW, ry: scaleH,
        seed: n.seed + row * 7 + i, color: tone, wob: 0.20, boil: 0.35,
        rot: sx * 0.02, prints: 1, edgeAlpha: 0.4,
      });
    }
  }
  /* the pointy hat of a top */
  Clay.blob(ctx, { x: 0.4, y: -H - 5, rx: 3.4, ry: 4.4, seed: n.seed + 90, color: '#7d5931', wob: 0.2, boil: 0.4, prints: 0 });

  /* googly eyes, glued on with far too much glue and no reference photo */
  const px = Math.sin(n.t * 2.3) * 0.5, py = Math.cos(n.t * 1.7) * 0.4;
  Clay.googlyEye(ctx, -5.2, -30, 5.2, px, py + (n.talk > 0 ? Math.sin(n.t * 30) * 0.3 : 0));
  Clay.googlyEye(ctx, 5.4, -32.6, 4.1, px * 0.8 + 0.15, py);
  /* the glue, still visible, still shiny, twelve weeks later */
  ctx.fillStyle = 'rgba(240,238,225,0.25)';
  ctx.beginPath(); ctx.ellipse(-5.2, -29.4, 6.4, 5.6, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5.4, -32, 5.1, 4.5, 0, 0, TAU); ctx.fill();

  /* half a pipe-cleaner moustache. The other half is a mystery he will not
     discuss, in a tone that suggests he ate it. */
  fuzzyLimb(ctx, -1, -23.5, -13, -21, 1.9, '#d98a2b', n.seed + 4, -3);
  ctx.restore();
};

/* chenille: a wire core with fibres sticking out at every angle */
function fuzzyLimb(ctx, x1, y1, x2, y2, r, color, seed, bow) {
  const steps = 22;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  ctx.lineCap = 'round';
  /* fibres first, so the core sits on top */
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const b = Math.sin(t * Math.PI) * (bow || 0);
    const px = lerp(x1, x2, t) + nx * b, py = lerp(y1, y2, t) + ny * b;
    for (let k = 0; k < 5; k++) {
      const h = seed * 3.1 + i * 7.7 + k * 2.3;
      const a = hash1(h) * TAU;
      const l = r * (0.9 + hash1(h + 1) * 1.5);
      ctx.strokeStyle = rgba(hash1(h + 2) > 0.5 ? warmLight(color, 0.28) : coolShade(color, 0.22), 0.75);
      ctx.lineWidth = 0.55;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = coolShade(color, 0.18);
  ctx.lineWidth = r * 1.15;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2 + nx * (bow || 0) * 2, (y1 + y2) / 2 + ny * (bow || 0) * 2, x2, y2);
  ctx.stroke();
  ctx.strokeStyle = warmLight(color, 0.22);
  ctx.lineWidth = r * 0.55;
  ctx.beginPath();
  ctx.moveTo(x1, y1 - r * 0.3);
  ctx.quadraticCurveTo((x1 + x2) / 2 + nx * (bow || 0) * 2, (y1 + y2) / 2 + ny * (bow || 0) * 2 - r * 0.3, x2, y2 - r * 0.3);
  ctx.stroke();
}

/* ======================================================================= */
/*  MADAME PIPPA PIPECLEANER -- of the Windowsill Ballet, retired, briefly */
/* ======================================================================= */

CAST.pippa = function (ctx, n, x, y) {
  const S = n.scale;
  const sway = Math.sin(n.t * 0.9) * 2.2;
  const legs = n.hasLeg === false ? 1 : 2;
  Clay.groundShadow(ctx, x, y + 1, 14 * S, 4 * S, 0.34);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(n.facing * S, S);
  ctx.rotate(talkWobble(n) * 0.6);

  const PINK = '#e5539b', PINK2 = '#f27ab5';

  /* leg(s). She lost one to the vacuum cleaner in the spring. */
  fuzzyLimb(ctx, -1, -26, -3 + sway * 0.2, -1, 1.5, PINK, n.seed + 1, 2.5);
  ctx.strokeStyle = '#e0a83c'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-3 + sway * 0.2, -1.5); ctx.lineTo(-6.5 + sway * 0.2, -0.2);
  ctx.moveTo(-3 + sway * 0.2, -1.5); ctx.lineTo(0.5 + sway * 0.2, -0.2);
  ctx.stroke();

  if (legs === 2) {
    fuzzyLimb(ctx, 2, -26, 5 + sway * 0.2, -1, 1.5, PINK, n.seed + 2, -2.5);
    ctx.strokeStyle = '#e0a83c'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(5 + sway * 0.2, -1.5); ctx.lineTo(1.5 + sway * 0.2, -0.2);
    ctx.moveTo(5 + sway * 0.2, -1.5); ctx.lineTo(8.5 + sway * 0.2, -0.2);
    ctx.stroke();
  } else if (n.clayLeg) {
    /* the replacement Norbert tore off himself. It doesn't match. She loves it. */
    Clay.limb(ctx, 2, -26, 5 + sway * 0.2, -1.5, 2.2, 2.6, NB_SKIN, { seed: 77, bow: -2, prints: 1 });
    Clay.blob(ctx, { x: 5 + sway * 0.2, y: -1, rx: 4, ry: 2.2, seed: 78, color: NB_SKIN, wob: 0.2, prints: 1 });
  }

  /* body: a fat coil of chenille */
  for (let i = 0; i < 7; i++) {
    const t = i / 6;
    fuzzyLimb(ctx, -9 + t * 2, -32 + t * 1.6, 9 - t * 2, -30 + t * 1.6, 3.4 - t * 0.9,
      i % 2 ? PINK : PINK2, n.seed + 10 + i, 3 - t * 4);
  }

  /* the neck. An S. Always an S. */
  const nk = (t) => {
    const a = -0.2 + Math.sin(n.t * 0.8) * 0.06;
    return {
      x: -2 + Math.sin(t * 3.0 + a) * 9 - t * 1.5,
      y: -34 - t * 26,
    };
  };
  for (let i = 0; i < 9; i++) {
    const p0 = nk(i / 9), p1 = nk((i + 1) / 9);
    fuzzyLimb(ctx, p0.x, p0.y, p1.x, p1.y, 2.0, i % 2 ? PINK : PINK2, n.seed + 30 + i, 0);
  }
  const hd = nk(1);

  /* head + a beak of folded black card */
  ctx.save();
  ctx.translate(hd.x, hd.y);
  ctx.rotate(-0.25 + Math.sin(n.t * 0.8) * 0.1 + (n.talk > 0 ? Math.sin(n.t * 22) * 0.08 : 0));
  fuzzyLimb(ctx, -3, 0, 3, -1, 3.0, PINK, n.seed + 50, 0);
  ctx.fillStyle = '#1c1a20';
  ctx.beginPath();
  ctx.moveTo(-3, -0.4); ctx.lineTo(-13, 2.4); ctx.lineTo(-3, 3.4); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  ctx.beginPath();
  ctx.moveTo(-3, -0.2); ctx.lineTo(-12, 2.1); ctx.lineTo(-6, 1.2); ctx.closePath();
  ctx.fill();
  Clay.beadEye(ctx, -1.4, -1.6, 1.5, { color: '#141018', hi: '#8a6a80' });
  /* one sequin, applied by Ivy, load-bearing to her entire self-image */
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath(); ctx.arc(3.4, -3.6, 2.0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(2.8, -4.2, 0.7, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
};

/* ======================================================================= */
/*  STEVE -- fired. Came out wrong. Runs the sink. Has opinions.           */
/* ======================================================================= */

CAST.steve = function (ctx, n, x, y) {
  const S = n.scale;
  const lean = Math.sin(n.t * 0.7) * 0.02 + talkWobble(n) * 0.4;
  Clay.groundShadow(ctx, x, y + 1, 26 * S, 7 * S, 0.44);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(n.facing * S, S);
  ctx.rotate(lean);

  const CREAM = '#e2d9c2';
  const W = 23, H = 42;

  /* the body of the mug -- FIRED, so it is hard and shiny, not matte */
  ctx.beginPath();
  ctx.moveTo(-W, -H);
  ctx.bezierCurveTo(-W - 1.5, -H * 0.4, -W * 0.85, -3, -W * 0.78, -1);
  ctx.lineTo(W * 0.78, -1);
  ctx.bezierCurveTo(W * 0.85, -3, W + 1.5, -H * 0.4, W, -H);
  ctx.closePath();
  const g = ctx.createLinearGradient(-W, -H, W * 0.9, 0);
  g.addColorStop(0, warmLight(CREAM, 0.30));
  g.addColorStop(0.22, CREAM);
  g.addColorStop(0.62, coolShade(CREAM, 0.20));
  g.addColorStop(1, coolShade(CREAM, 0.46));
  ctx.fillStyle = g; ctx.fill();

  /* glaze runs -- somebody dipped him crooked and that was that */
  ctx.save(); ctx.clip();
  const bg = ctx.createLinearGradient(0, -H, 0, -2);
  bg.addColorStop(0, 'rgba(58,104,148,0.85)');
  bg.addColorStop(0.42, 'rgba(74,126,168,0.7)');
  bg.addColorStop(0.62, 'rgba(90,140,180,0.15)');
  bg.addColorStop(1, 'rgba(90,140,180,0)');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-W - 2, -H - 2);
  ctx.lineTo(W + 2, -H - 2);
  ctx.lineTo(W + 2, -H * 0.42);
  for (let i = 0; i <= 10; i++) {
    const px = W + 2 - (2 * W + 4) * (i / 10);
    ctx.lineTo(px, -H * 0.42 + Math.pow(noise1(i * 1.3 + n.seed, n.seed), 2.4) * 16);
  }
  ctx.closePath(); ctx.fill();
  /* hard specular band: this is what "finished" looks like */
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.ellipse(-W * 0.55, -H * 0.55, 3.4, H * 0.36, 0.06, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(W * 0.62, -H * 0.5, 1.8, H * 0.28, -0.04, 0, TAU); ctx.fill();
  ctx.restore();

  /* the rim, and the chip out of it */
  ctx.beginPath();
  ctx.ellipse(0, -H, W, 6.4, 0, 0, TAU);
  ctx.fillStyle = '#3a3a44'; ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -H, W * 0.86, 5.0, 0, 0, TAU);
  ctx.fillStyle = '#1e2028'; ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -H - 0.5, W, 6.4, 0, Math.PI * 1.02, Math.PI * 1.98);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.6; ctx.stroke();
  /* THE CHIP */
  ctx.fillStyle = CREAM;
  ctx.beginPath();
  ctx.moveTo(W * 0.34, -H - 2.6);
  ctx.lineTo(W * 0.58, -H - 5.4);
  ctx.lineTo(W * 0.74, -H - 1.4);
  ctx.closePath();
  ctx.fillStyle = 'rgba(20,20,26,0.9)'; ctx.fill();
  ctx.fillStyle = 'rgba(226,217,194,0.9)';
  ctx.beginPath();
  ctx.moveTo(W * 0.36, -H - 2.2); ctx.lineTo(W * 0.56, -H - 4.6); ctx.lineTo(W * 0.6, -H - 2.0);
  ctx.closePath(); ctx.fill();

  /* the handle. On the inside. Nobody knows how. */
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, -H, W * 0.86, 5.0, 0, 0, TAU);
  ctx.clip();
  ctx.strokeStyle = '#c9c0aa'; ctx.lineWidth = 4.6;
  ctx.beginPath(); ctx.arc(2, -H + 5, 8.5, Math.PI * 1.15, Math.PI * 1.95); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(2, -H + 4.2, 8.5, Math.PI * 1.2, Math.PI * 1.9); ctx.stroke();
  ctx.restore();

  /* a face, painted on by hand, slightly to the left of where it should be */
  const bl = Math.sin(n.t * 1.3) > 0.985 ? 0 : 1;
  ctx.fillStyle = '#2a2530';
  if (bl) {
    ctx.beginPath(); ctx.ellipse(-7.5, -H * 0.60, 2.1, 2.6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.5, -H * 0.62, 1.9, 2.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-8.2, -H * 0.64, 0.7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(2.9, -H * 0.66, 0.6, 0, TAU); ctx.fill();
  } else {
    ctx.strokeStyle = '#2a2530'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-9.6, -H * 0.60); ctx.lineTo(-5.4, -H * 0.60);
    ctx.moveTo(1.8, -H * 0.62); ctx.lineTo(5.2, -H * 0.62); ctx.stroke();
  }
  /* the flattest mouth ever painted on anything */
  ctx.strokeStyle = '#2a2530'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath();
  if (n.mood === 'warm') { ctx.arc(-2, -H * 0.38, 5.6, 0.35, 2.6); }
  else { ctx.moveTo(-8, -H * 0.34); ctx.lineTo(3.6, -H * 0.36); }
  ctx.stroke();
  /* eyebrows of a man who has been through the kiln */
  ctx.lineWidth = 1.7;
  ctx.beginPath();
  ctx.moveTo(-11, -H * 0.76); ctx.lineTo(-5.0, -H * 0.70);
  ctx.moveTo(0.6, -H * 0.72); ctx.lineTo(6.2, -H * 0.79);
  ctx.stroke();

  ctx.restore();
};

/* ======================================================================= */
/*  BEANS                                                                   */
/* ======================================================================= */

CAST.beans = function (ctx, n, x, y) {
  const S = n.scale;
  const squish = n.talk > 0 ? Math.abs(Math.sin(n.t * 9)) * 0.22 : 0;
  const hop = Math.max(0, Math.sin(n.t * 2.2)) * (n.hoppy ? 4.5 : 0.9);
  Clay.groundShadow(ctx, x, y + 1, 9 * S, 3 * S, 0.36 - hop * 0.02);
  ctx.save();
  ctx.translate(x, y - hop);
  ctx.scale(S * (1 + squish), S * (1 - squish * 0.8));
  Clay.blob(ctx, {
    x: 0, y: -7.5, rx: 8.6, ry: 7.6, seed: n.seed + 1, color: '#8b9078',
    wob: 0.17, boil: 0.8, prints: 2,
  });
  /* one eye. That's the whole face. */
  Clay.beadEye(ctx, -1.2, -9.6, 2.0, {});
  ctx.strokeStyle = 'rgba(50,52,42,0.45)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (n.talk > 0) ctx.ellipse(0.6, -4.6, 1.8, 1.4, 0, 0, TAU);
  else ctx.arc(0.6, -6.4, 2.4, 0.5, 2.4);
  ctx.stroke();
  ctx.restore();
};

/* ======================================================================= */
/*  GLAZE -- a porcelain swan. Genuinely nice. Somehow worse for it.       */
/* ======================================================================= */

CAST.glaze = function (ctx, n, x, y) {
  const S = n.scale;
  Clay.groundShadow(ctx, x, y + 1, 20 * S, 5.5 * S, 0.34);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(n.facing * S, S);

  const P = '#f4f2ec';
  /* Note the arguments: wob 0, prints 0. Glaze has no thumbprints on Glaze.
     Nobody's hand shows anywhere on Glaze. */
  const perfect = { wob: 0, prints: 0, boil: 0, n: 40 };

  /* body */
  Clay.blob(ctx, Object.assign({ x: 0, y: -16, rx: 19, ry: 14.5, seed: 1, color: P }, perfect));
  /* the wing, a single flawless sweep */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-11, -20);
  ctx.bezierCurveTo(0, -30, 15, -26, 16, -13);
  ctx.bezierCurveTo(8, -8, -6, -10, -11, -20);
  ctx.closePath();
  const wg = ctx.createLinearGradient(-11, -30, 16, -8);
  wg.addColorStop(0, '#ffffff');
  wg.addColorStop(0.5, '#eceae4');
  wg.addColorStop(1, '#c9d6da');
  ctx.fillStyle = wg; ctx.fill();
  ctx.strokeStyle = 'rgba(150,170,180,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
  /* feather lines, evenly spaced, mechanically */
  ctx.strokeStyle = 'rgba(150,172,184,0.4)'; ctx.lineWidth = 0.7;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-6 + i * 4.6, -21 + i * 1.2);
    ctx.quadraticCurveTo(2 + i * 3.4, -17 + i * 1.6, 6 + i * 2.2, -12 + i * 0.8);
    ctx.stroke();
  }
  ctx.restore();

  /* neck: a perfect circular arc, of course */
  ctx.strokeStyle = P; ctx.lineWidth = 7.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-13, -33, 14, 0.35, 1.75); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(-13.8, -33.6, 14, 0.5, 1.6); ctx.stroke();
  /* the cyan glaze pooling in the low places, beautifully */
  ctx.strokeStyle = 'rgba(122,196,216,0.55)'; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.arc(-12.2, -32.4, 14, 0.45, 1.1); ctx.stroke();

  /* head */
  const hx = -13 + Math.cos(0.35) * 14 - 1, hy = -33 + Math.sin(0.35) * 14 - 12;
  ctx.save();
  ctx.translate(hx + 1, hy - 1);
  ctx.rotate(talkWobble(n) * 0.5 - 0.1);
  Clay.blob(ctx, Object.assign({ x: 0, y: 0, rx: 6.2, ry: 5.4, seed: 2, color: P }, perfect));
  /* gold lustre beak */
  const bg2 = ctx.createLinearGradient(-4, 0, -14, 4);
  bg2.addColorStop(0, '#f0cf72'); bg2.addColorStop(0.5, '#d9ab3c'); bg2.addColorStop(1, '#a97d21');
  ctx.beginPath();
  ctx.moveTo(-4, -1.6); ctx.lineTo(-14, 1.8); ctx.lineTo(-4, 3.4); ctx.closePath();
  ctx.fillStyle = bg2; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.moveTo(-5, -0.8); ctx.lineTo(-12.4, 1.4); ctx.lineTo(-7, 0.8); ctx.closePath(); ctx.fill();
  /* eye: a single painted dot with a perfect eyelash */
  ctx.fillStyle = '#2b3138';
  ctx.beginPath(); ctx.ellipse(-1.2, -1.2, 1.5, 1.9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-1.7, -1.9, 0.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2b3138'; ctx.lineWidth = 0.7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2.6, -3.6); ctx.lineTo(-4.4, -5.0);
  ctx.moveTo(-1.0, -3.9); ctx.lineTo(-1.6, -5.8); ctx.stroke();
  ctx.restore();

  /* one flawless highlight, in exactly the right place */
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-8, -22, 4.2, 6.4, -0.4, 0, TAU); ctx.fill();
  ctx.restore();
};

/* ======================================================================= */
/*  THE COUNCIL OF CRAFTS                                                   */
/* ======================================================================= */

CAST.sock = function (ctx, n, x, y) {
  const S = n.scale;
  const gape = n.talk > 0 ? 0.35 + Math.abs(Math.sin(n.t * 14)) * 0.55 : 0.12;
  Clay.groundShadow(ctx, x, y + 1, 20 * S, 5 * S, 0.4);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(n.facing * S, S);
  ctx.rotate(Math.sin(n.t * 1.1) * 0.03);

  const A = '#dcd6c8', B = '#b8535e';
  /* the tube of the sock, with its stripes */
  for (let i = 8; i >= 0; i--) {
    const t = i / 8;
    const yy = -6 - t * 44;
    const rr = 12 - t * 1.2 + Math.sin(t * 4) * 1.2;
    Clay.blob(ctx, {
      x: Math.sin(t * 2.2 + n.t * 0.6) * 4 * t, y: yy, rx: rr, ry: 5.4,
      seed: n.seed + i, color: i % 3 === 0 ? B : A, wob: 0.12, boil: 0.4, prints: 1, edgeAlpha: 0.25,
    });
  }
  /* the head/mouth, hinged like a hand is inside it (there is no hand) */
  const hx = Math.sin(2.2 + n.t * 0.6) * 4, hy = -52;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(-0.2);
  ctx.save(); ctx.rotate(-gape * 0.5);
  Clay.blob(ctx, { x: -3, y: -4, rx: 15, ry: 7, seed: n.seed + 40, color: A, wob: 0.1, boil: 0.4, prints: 2 });
  ctx.restore();
  ctx.save(); ctx.rotate(gape * 0.5);
  Clay.blob(ctx, { x: -3, y: 3.4, rx: 14, ry: 6, seed: n.seed + 41, color: A, wob: 0.1, boil: 0.4, prints: 2 });
  /* a felt tongue, cut with the round-ended scissors */
  ctx.fillStyle = '#c4566a';
  ctx.beginPath(); ctx.ellipse(-10, 1.6, 7, 2.6, -0.1, 0, TAU); ctx.fill();
  ctx.restore();
  Clay.googlyEye(ctx, -3, -9.5, 4.6, 0.1, -0.2);
  Clay.googlyEye(ctx, 4.2, -10.6, 4.0, 0.15, -0.25);
  ctx.restore();
  ctx.restore();
};

CAST.macaroni = function (ctx, n, x, y) {
  const S = n.scale;
  Clay.groundShadow(ctx, x, y + 1, 17 * S, 4.4 * S, 0.34);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(n.facing * S, S);
  /* a necklace standing up on its own, which nobody comments on */
  const N = 16;
  for (let i = 0; i < N; i++) {
    const a = -Math.PI * 0.5 + (i / (N - 1)) * Math.PI * 2;
    const px = Math.cos(a) * 14, py = -22 + Math.sin(a) * 20;
    const wob2 = n.talk > 0 ? Math.sin(n.t * 12 + i) * 1.4 : Math.sin(n.t * 1.4 + i * 0.5) * 0.5;
    ctx.save();
    ctx.translate(px, py + wob2);
    ctx.rotate(a + 1.57);
    Clay.blob(ctx, {
      x: 0, y: 0, rx: 2.6, ry: 4.4, seed: n.seed + i * 3,
      color: ['#e6c877', '#dcb85e', '#efd48d'][i % 3], wob: 0.14, boil: 0.5, prints: 0,
    });
    ctx.fillStyle = 'rgba(60,40,20,0.5)';
    ctx.beginPath(); ctx.ellipse(0, -3.4, 1.1, 0.8, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(200,190,170,0.6)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.ellipse(0, -22, 14, 20, 0, 0, TAU); ctx.stroke();
  /* the two pieces of pasta that everyone agrees are the face */
  Clay.beadEye(ctx, -4.6, -30, 1.7, {});
  Clay.beadEye(ctx, 4.2, -30, 1.7, {});
  ctx.restore();
};

CAST.volcano = function (ctx, n, x, y) {
  const S = n.scale;
  const erupt = n.erupt || 0;
  Clay.groundShadow(ctx, x, y + 1, 34 * S, 8 * S, 0.44);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(S, S);
  /* papier-mache: newsprint lumps under grey-brown poster paint */
  const pts = [];
  for (let i = 0; i <= 22; i++) {
    const t = i / 22;
    const px = -34 + t * 68;
    const py = -Math.pow(Math.sin(t * Math.PI), 0.65) * 48 - 1;
    pts.push({ x: px + shash1(i * 3 + n.seed) * 2.2, y: py + shash1(i * 7 + n.seed) * 2.2 });
  }
  pts.push({ x: 34, y: 0 }, { x: -34, y: 0 });
  Clay.slab(ctx, pts, '#7d6b58', { seed: n.seed, prints: 30, markSize: 4.4, vert: true, vertH: 60 });
  /* the crater, painted a red he is extremely proud of */
  ctx.beginPath(); ctx.ellipse(0, -47, 9, 3.4, 0, 0, TAU);
  ctx.fillStyle = '#8c2f22'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -47.6, 6.4, 2.2, 0, 0, TAU);
  ctx.fillStyle = '#c1442b'; ctx.fill();
  /* strips of newspaper still legible if you get close */
  ctx.strokeStyle = 'rgba(240,236,220,0.14)'; ctx.lineWidth = 0.7;
  for (let i = 0; i < 22; i++) {
    const px = -28 + hash1(i * 3.3 + n.seed) * 56;
    const py = -hash1(i * 7.1 + n.seed) * 42;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 5 + hash1(i) * 8, py + shash1(i * 2) * 2); ctx.stroke();
  }
  /* eyes, low on the slope, giving him a permanent look of ambition */
  Clay.googlyEye(ctx, -11, -20, 5.4, 0.1, -0.3);
  Clay.googlyEye(ctx, 10, -21, 5.0, 0.05, -0.3);
  if (erupt > 0) {
    for (let i = 0; i < 26; i++) {
      const t = ((n.t * 2.4 + i * 0.13) % 1);
      const a = -1.57 + shash1(i * 3) * 0.7;
      const d = t * 60 * erupt;
      const px = Math.cos(a) * d * 0.5, py = -47 + Math.sin(a) * d;
      ctx.globalAlpha = (1 - t) * 0.85 * erupt;
      ctx.fillStyle = i % 3 ? '#fff6ea' : '#ffd9b0';
      ctx.beginPath(); ctx.arc(px, py, 2 + t * 6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
};

/* ======================================================================= */
/*  THE THUMB                                                               */
/* ======================================================================= */

/* Ivy's thumb, coming down out of the sky. Drawn at whatever scale the scene
   needs; `n.desc` is 0 (out of frame) to 1 (touching the ground). */
CAST.thumb = function (ctx, n, x, y) {
  const d = clamp(n.desc || 0, 0, 1);
  if (d <= 0.001) return;
  const S = n.scale || 1;
  const H = 420 * S;
  const ty = y - (1 - d) * H * 1.4;

  /* a shadow that arrives before the thumb does */
  ctx.save();
  const shR = 70 * S * (0.5 + d * 0.9);
  const sg = ctx.createRadialGradient(x, y, 0, x, y, shR);
  sg.addColorStop(0, 'rgba(16,6,20,' + 0.6 * d + ')');
  sg.addColorStop(1, 'rgba(16,6,20,0)');
  ctx.fillStyle = sg;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.30); ctx.translate(-x, -y);
  ctx.beginPath(); ctx.arc(x, y, shR, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();

  ctx.save();
  ctx.translate(x, ty);
  ctx.rotate((n.tilt || 0.06) + Math.sin(n.t * 0.7) * 0.01);
  ctx.scale(S, S);

  const SKIN = '#e0a98c';
  /* the digit */
  ctx.beginPath();
  ctx.moveTo(-56, -420);
  ctx.bezierCurveTo(-64, -220, -60, -96, -44, -44);
  ctx.bezierCurveTo(-32, -6, 30, -4, 42, -44);
  ctx.bezierCurveTo(58, -98, 62, -230, 54, -420);
  ctx.closePath();
  const g = ctx.createLinearGradient(-60, -200, 62, -60);
  g.addColorStop(0, '#f3c8ae');
  g.addColorStop(0.35, SKIN);
  g.addColorStop(0.75, '#b87f6a');
  g.addColorStop(1, '#8d5c50');
  ctx.fillStyle = g; ctx.fill();

  ctx.save(); ctx.clip();
  /* knuckle crease */
  ctx.strokeStyle = 'rgba(130,78,66,0.35)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-58, -300 + i * 12);
    ctx.quadraticCurveTo(0, -286 + i * 12, 56, -302 + i * 12);
    ctx.stroke();
  }
  /* THE FINGERPRINT. Concentric, enormous, and the single most alien thing
     in this entire craft room. */
  ctx.strokeStyle = 'rgba(150,92,78,0.34)';
  ctx.lineWidth = 2.6;
  for (let i = 1; i < 17; i++) {
    ctx.beginPath();
    ctx.ellipse(-2, -120, i * 4.6, i * 6.6, 0.05, 0.2, Math.PI * 1.9);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,222,204,0.22)';
  ctx.lineWidth = 1.4;
  for (let i = 1; i < 17; i++) {
    ctx.beginPath();
    ctx.ellipse(-3, -122, i * 4.6, i * 6.6, 0.05, 0.2, Math.PI * 1.9);
    ctx.stroke();
  }
  /* a smear of dried orange clay under the nail, which is Norbert */
  ctx.fillStyle = 'rgba(190,110,72,0.4)';
  ctx.beginPath(); ctx.ellipse(24, -70, 16, 9, 0.4, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(120,70,60,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-56, -420);
  ctx.bezierCurveTo(-64, -220, -60, -96, -44, -44);
  ctx.bezierCurveTo(-32, -6, 30, -4, 42, -44);
  ctx.bezierCurveTo(58, -98, 62, -230, 54, -420);
  ctx.stroke();
  ctx.restore();
};

/* ======================================================================= */
/*  Portrait heads, for the dialogue box                                    */
/* ======================================================================= */

const PORTRAITS = {
  norbert(ctx, t, talking) {
    const n = makeNorbertRig();
    n.mood = talking ? (Math.sin(t * 12) > 0 ? 'oh' : 'neutral') : 'neutral';
    n.t = t; n.blink = (t % 3.1) < 0.12 ? 1 : 0;
    ctx.save(); ctx.translate(0, 12); ctx.scale(1.5, 1.5);
    Clay.blobPath(ctx, 0, 0, 10.2, 9.6, 3, 0.075, 0.05, 0.3, 22);
    Clay.material(ctx, { x: -12, y: -12, w: 24, h: 24 }, NB_SKIN, { seed: 3, prints: 3 });
    drawNbCurl(ctx, 0.8, -9, Math.sin(t * 1.4) * 0.2, NB_SKIN);
    Clay.dent(ctx, -2.6, -5.4, 3.9, 2.5, -0.28, NB_SKIN);
    drawNbFace(ctx, n, 10.2, 9.6, NB_SKIN);
    ctx.restore();
  },
  gary(ctx, t, talking) {
    ctx.save(); ctx.translate(0, 26); ctx.scale(1.35, 1.35);
    CAST.gary(ctx, { t, seed: 4, facing: 1, scale: 1, talk: talking ? 1 : 0, bobPhase: 0 }, 0, 0);
    ctx.restore();
  },
  pippa(ctx, t, talking) {
    ctx.save(); ctx.translate(4, 40); ctx.scale(1.05, 1.05);
    CAST.pippa(ctx, { t, seed: 7, facing: 1, scale: 1, talk: talking ? 1 : 0, hasLeg: true }, 0, 0);
    ctx.restore();
  },
  steve(ctx, t, talking) {
    ctx.save(); ctx.translate(0, 20); ctx.scale(1.15, 1.15);
    CAST.steve(ctx, { t, seed: 2, facing: 1, scale: 1, talk: talking ? 1 : 0 }, 0, 0);
    ctx.restore();
  },
  beans(ctx, t, talking) {
    ctx.save(); ctx.translate(0, 22); ctx.scale(2.1, 2.1);
    CAST.beans(ctx, { t, seed: 9, facing: 1, scale: 1, talk: talking ? 1 : 0 }, 0, 0);
    ctx.restore();
  },
  glaze(ctx, t, talking) {
    ctx.save(); ctx.translate(9, 26); ctx.scale(1.0, 1.0);
    CAST.glaze(ctx, { t, seed: 3, facing: 1, scale: 1, talk: talking ? 1 : 0 }, 0, 0);
    ctx.restore();
  },
  council(ctx, t, talking) {
    ctx.save(); ctx.translate(0, 24); ctx.scale(0.82, 0.82);
    CAST.sock(ctx, { t, seed: 5, facing: 1, scale: 1, talk: talking ? 1 : 0 }, 0, 0);
    ctx.restore();
  },
  thumb(ctx, t) {
    ctx.save(); ctx.translate(0, 30); ctx.scale(0.14, 0.14);
    CAST.thumb(ctx, { t, desc: 1, scale: 1, tilt: 0 }, 0, 0);
    ctx.restore();
  },
};


/* ===== src/dialogue.js ===== */
/* =========================================================================
   NORBERT, UNFINISHED  --  dialogue.js
   A talking box.

   The text is drawn one glyph at a time with a tiny seeded offset per letter
   that re-rolls on the stop-motion tick, so the lettering trembles the way
   everything else in the frame does. It costs a few hundred fillText calls and
   it is worth every one of them.
   ========================================================================= */

const UI_FONT = '"Trebuchet MS", "DejaVu Sans", Verdana, system-ui, sans-serif';

const Dialogue = {
  active: false,
  queue: [],
  line: null,
  chars: 0,
  t: 0,
  speed: 38,          // characters per second
  done: false,
  onEnd: null,
  choice: null,
  choiceIdx: 0,
  boxY: 0,
  hold: 0,
};

Dialogue.start = function (script, onEnd) {
  Dialogue.queue = script.slice();
  Dialogue.active = true;
  Dialogue.onEnd = onEnd || null;
  Dialogue.boxY = 1;
  Dialogue._next();
};

Dialogue._next = function () {
  if (!Dialogue.queue.length) {
    Dialogue.active = false;
    Dialogue.line = null;
    const cb = Dialogue.onEnd; Dialogue.onEnd = null;
    if (cb) cb();
    return;
  }
  const l = Dialogue.queue.shift();
  if (typeof l === 'function') { l(); Dialogue._next(); return; }
  /* a bare { act: 'name' } entry fires a story beat and moves straight on */
  if (l.act !== undefined && l.text === undefined) {
    if (Dialogue.onAct) Dialogue.onAct(l.act);
    Dialogue._next();
    return;
  }
  Dialogue.line = l;
  Dialogue.chars = 0;
  Dialogue.done = false;
  Dialogue.t = 0;
  Dialogue.hold = 0;
  Dialogue.choice = l.choice || null;
  Dialogue.choiceIdx = 0;
  if (l.shake) Cam.kick(l.shake);
  if (l.sfx) Sound.play(l.sfx);
};

Dialogue.skipAll = function () {
  Dialogue.queue.length = 0;
  Dialogue.active = false;
  Dialogue.line = null;
  const cb = Dialogue.onEnd; Dialogue.onEnd = null;
  if (cb) cb();
};

Dialogue.update = function (dt) {
  if (!Dialogue.active) { Dialogue.boxY = approach(Dialogue.boxY, 1, dt * 5); return; }
  Dialogue.boxY = approach(Dialogue.boxY, 0, dt * 6);
  const l = Dialogue.line;
  if (!l) return;
  Dialogue.t += dt;

  const full = l.text ? l.text.length : 0;
  if (!Dialogue.done) {
    const sp = Dialogue.speed * (l.speed || 1) * (Input.held.jump || Input.held.talk ? 3.2 : 1);
    const before = Math.floor(Dialogue.chars);
    Dialogue.chars = Math.min(full, Dialogue.chars + sp * dt);
    const after = Math.floor(Dialogue.chars);
    if (after > before) {
      const ch = l.text[after - 1];
      if (ch && ch !== ' ' && (after % 2 === 0)) Sound.blip(l.who || 'narrator');
    }
    if (Dialogue.chars >= full) { Dialogue.done = true; Dialogue.hold = 0; }
  } else {
    Dialogue.hold += dt;
  }

  if (Dialogue.choice && Dialogue.done) {
    if (Input.pressed.up || Input.pressed.left) { Dialogue.choiceIdx = (Dialogue.choiceIdx + Dialogue.choice.length - 1) % Dialogue.choice.length; Sound.play('ui'); }
    if (Input.pressed.down || Input.pressed.right) { Dialogue.choiceIdx = (Dialogue.choiceIdx + 1) % Dialogue.choice.length; Sound.play('ui'); }
    if (Input.pressed.talk || Input.pressed.jump) {
      const c = Dialogue.choice[Dialogue.choiceIdx];
      Sound.play('uiBig');
      Dialogue.choice = null;
      if (c.then) Dialogue.queue = c.then.concat(Dialogue.queue);
      Dialogue._next();
    }
    return;
  }

  if (Input.pressed.talk || Input.pressed.jump) {
    if (!Dialogue.done) { Dialogue.chars = full; Dialogue.done = true; }
    else { Sound.play('ui'); Dialogue._next(); }
  }
  /* auto-advance for cinematic lines */
  if (l.auto && Dialogue.done && Dialogue.hold > (l.auto || 1.4)) Dialogue._next();
};

/* Hand-lettered text: every glyph gets its own little wobble. */
function jitterText(ctx, str, x, y, seed, amount) {
  amount = amount === undefined ? 0.55 : amount;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const w = ctx.measureText(ch).width;
    if (ch !== ' ') {
      const h = seed + i * 3.77;
      const ox = shash1(h + Clay.frame * 0.011) * amount;
      const oy = shash1(h + 40 + Clay.frame * 0.013) * amount;
      const rot = shash1(h + 80) * 0.035 * amount;
      ctx.save();
      ctx.translate(cx + w / 2 + ox, y + oy);
      ctx.rotate(rot);
      ctx.fillText(ch, -w / 2, 0);
      ctx.restore();
    }
    cx += w;
  }
  return cx - x;
}

function jitterTextOutlined(ctx, str, x, y, seed, fill, outline, lw) {
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const w = ctx.measureText(ch).width;
    if (ch !== ' ') {
      const h = seed + i * 3.77;
      const ox = shash1(h + Clay.frame * 0.011) * 0.6;
      const oy = shash1(h + 40 + Clay.frame * 0.013) * 0.6;
      const rot = shash1(h + 80) * 0.03;
      ctx.save();
      ctx.translate(cx + w / 2 + ox, y + oy);
      ctx.rotate(rot);
      if (outline) {
        ctx.lineWidth = lw || 3.4; ctx.strokeStyle = outline;
        ctx.lineJoin = 'round'; ctx.miterLimit = 2;
        ctx.strokeText(ch, -w / 2, 0);
      }
      ctx.fillStyle = fill;
      ctx.fillText(ch, -w / 2, 0);
      ctx.restore();
    }
    cx += w;
  }
  return cx - x;
}

/* ---------------------------------------------------------------------- */

const SPEAKER_NAMES = {
  norbert: 'NORBERT', gary: 'GARY', pippa: 'MME. PIPPA', steve: 'STEVE',
  beans: 'BEANS', glaze: 'GLAZE', council: 'MAYOR SOCK', thumb: '', narrator: '',
};

Dialogue.draw = function (ctx, W, H) {
  if (!Dialogue.active && Dialogue.boxY >= 0.999) return;
  const l = Dialogue.line;
  if (!l) return;

  const BH = 84;
  const slide = easeOutCubic(1 - Dialogue.boxY);
  const by = H - BH - 12 + (1 - slide) * (BH + 24);

  ctx.save();
  ctx.globalAlpha = slide;

  const bx = 22, bw = W - 44;
  const hasPortrait = l.who && PORTRAITS[l.who];
  const px = bx + 44;

  /* the box, rolled flat out of grey clay and pressed onto the screen */
  const pts = [];
  const per = 2 * (bw + BH);
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    let x, y;
    const d = t * per;
    if (d < bw) { x = bx + d; y = by; }
    else if (d < bw + BH) { x = bx + bw; y = by + (d - bw); }
    else if (d < 2 * bw + BH) { x = bx + bw - (d - bw - BH); y = by + BH; }
    else { x = bx; y = by + BH - (d - 2 * bw - BH); }
    const n = (fbm1(t * 9 + 3, 5, 2) - 0.5) * 4.4;
    pts.push({ x: x + n * 0.6, y: y + n });
  }
  ctx.save();
  ctx.shadowColor = 'rgba(10,4,16,0.55)';
  ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  Clay.slab(ctx, pts, '#e8dfc9', {
    seed: 12, prints: 46, markSize: 4.4, vert: true, vertH: BH * 1.5,
    edgeAlpha: 0.3, spec: false, rim: false, ao: false,
  });
  ctx.restore();

  /* portrait roundel */
  if (hasPortrait) {
    const cx0 = bx + 30, cy0 = by + BH / 2;
